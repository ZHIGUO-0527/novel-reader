<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云中书阁 - 小说阅读</title>
<style>
:root {
  --bg: #f5f0e8; --bg2: #ede4d3; --text: #3d3226; --text2: #6b5d4f;
  --accent: #8b5e3c; --accent2: #c4956a; --card: #fffaf2; --cardBorder: #e0d5c0;
  --sidebar: #faf6ef; --divider: #e0d5c0; --hover: #f0e8d8;
  --shadow: rgba(0,0,0,0.06); --selection: #d4c4a8; --star: #f0c040;
}
:root[data-theme="dark"] {
  --bg: #1a1a1e; --bg2: #222228; --text: #d0d0d0; --text2: #999;
  --accent: #c4956a; --accent2: #d4a87c; --card: #252530; --cardBorder: #333;
  --sidebar: #1e1e24; --divider: #333; --hover: #2a2a35;
  --shadow: rgba(0,0,0,0.3); --selection: #4a4030; --star: #e0b830;
}
:root[data-theme="eye"] {
  --bg: #e8f0e0; --bg2: #d8e8ce; --text: #3a4a32; --text2: #5a6a52;
  --accent: #6b8a5e; --accent2: #7a9a6e; --card: #f0f6ec; --cardBorder: #c8d8be;
  --sidebar: #eaf4e4; --divider: #c8d8be; --hover: #dce8d4;
  --shadow: rgba(0,0,0,0.04); --selection: #c0d4b0; --star: #d4a030;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: 'STSong','Songti SC','SimSun','KaiTi',serif; min-height: 100vh; transition: background 0.3s, color 0.3s; }
::selection { background: var(--selection); }

/* ====== Topbar ====== */
#topbar { position: sticky; top: 0; z-index: 100; background: var(--bg2); border-bottom: 1px solid var(--divider); padding: 0 20px; display: flex; align-items: center; height: 52px; gap: 10px; backdrop-filter: blur(8px); }
#topbar .logo { font-size: 20px; font-weight: bold; color: var(--accent); cursor: pointer; letter-spacing: 2px; white-space: nowrap; }
.search-wrap { flex: 1; max-width: 280px; position: relative; }
.search-wrap input { width: 100%; padding: 7px 12px 7px 32px; border: 1px solid var(--divider); border-radius: 20px; background: var(--card); color: var(--text); font-size: 13px; font-family: inherit; outline: none; transition: border-color 0.2s; }
.search-wrap input:focus { border-color: var(--accent2); }
.search-wrap .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 14px; color: var(--text2); pointer-events: none; }
#topbar .right-btns { display: flex; gap: 6px; align-items: center; }
.top-btn { background: none; border: 1px solid var(--divider); color: var(--text2); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; transition: all 0.2s; font-family: inherit; white-space: nowrap; }
.top-btn:hover { background: var(--hover); color: var(--text); border-color: var(--accent2); }
.top-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.top-btn.upload-btn { background: #e74c3c; color: #fff; border-color: #e74c3c; }
.top-btn.upload-btn:hover { background: #c0392b; }
.user-dropdown { position: relative; }
.user-dropdown .dropdown-menu { display: none; position: absolute; top: 42px; right: 0; background: var(--card); border: 1px solid var(--cardBorder); border-radius: 8px; min-width: 130px; box-shadow: 0 8px 24px var(--shadow); overflow: hidden; z-index: 60; }
.user-dropdown .dropdown-menu.show { display: block; }
.user-dropdown .dropdown-menu .dm-item { padding: 10px 16px; cursor: pointer; font-size: 13px; color: var(--text2); border-bottom: 1px solid var(--divider); transition: background 0.15s; }
.user-dropdown .dropdown-menu .dm-item:hover { background: var(--hover); color: var(--text); }
.user-dropdown .dropdown-menu .dm-item:last-child { border-bottom: none; color: #c0392b; }

/* ====== Category tabs ====== */
#category-tabs { display: flex; gap: 6px; justify-content: center; margin-bottom: 24px; flex-wrap: wrap; align-items: center; }
.cat-tab { padding: 5px 16px; border-radius: 20px; border: 1px solid var(--divider); background: var(--card); color: var(--text2); cursor: pointer; font-size: 13px; font-family: inherit; transition: all 0.2s; }
.cat-tab:hover { border-color: var(--accent2); color: var(--text); }
.cat-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ====== Recommended section ====== */
.recommended-section { max-width: 1140px; margin: 0 auto 32px; padding: 0 24px; }
.recommended-section .rec-header { font-size: 20px; font-weight: bold; color: var(--accent); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.recommended-section .rec-header .rec-icon { font-size: 24px; }
.rec-scroll { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x mandatory; }
.rec-scroll::-webkit-scrollbar { height: 6px; }
.rec-scroll::-webkit-scrollbar-thumb { background: var(--divider); border-radius: 3px; }
.rec-card { min-width: 280px; max-width: 280px; flex-shrink: 0; scroll-snap-align: start; background: var(--card); border: 1px solid var(--cardBorder); border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 2px 8px var(--shadow); position: relative; }
.rec-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px var(--shadow); }
.rec-card .rec-cover { height: 140px; display: flex; align-items: center; justify-content: center; font-size: 36px; color: #fff; font-weight: bold; position: relative; }
.rec-card .rec-cover .rec-cover-text { text-shadow: 0 2px 6px rgba(0,0,0,0.3); writing-mode: vertical-rl; letter-spacing: 2px; }
.rec-card .rec-cover .rec-rank { position: absolute; top: 8px; left: 8px; width: 28px; height: 28px; border-radius: 50%; background: var(--star); color: #333; font-weight: bold; font-size: 14px; display: flex; align-items: center; justify-content: center; writing-mode: horizontal-tb; }
.rec-card .rec-info { padding: 12px; }
.rec-card .rec-info h3 { font-size: 15px; color: var(--text); margin-bottom: 4px; }
.rec-card .rec-info .rec-meta { font-size: 11px; color: var(--text2); }
.rec-card .rec-score { position: absolute; bottom: 8px; right: 10px; font-size: 13px; font-weight: bold; color: var(--star); }

/* ====== Bookshelf ====== */
#bookshelf { max-width: 1140px; margin: 0 auto; padding: 32px 24px; }
#bookshelf h1 { text-align: center; font-size: 28px; margin-bottom: 8px; color: var(--text); letter-spacing: 3px; }
#bookshelf .subtitle { text-align: center; color: var(--text2); margin-bottom: 6px; font-size: 14px; }
.book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 24px; }
.no-results { text-align: center; color: var(--text2); padding: 60px 0; font-size: 15px; }

.book-card { background: var(--card); border: 1px solid var(--cardBorder); border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 2px 8px var(--shadow); }
.book-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px var(--shadow); }
.book-cover { height: 180px; display: flex; align-items: center; justify-content: center; font-size: 46px; color: #fff; letter-spacing: 4px; font-weight: bold; position: relative; }
.book-cover .cover-text { text-shadow: 0 2px 8px rgba(0,0,0,0.3); writing-mode: vertical-rl; }
.book-cover .cat-badge { position: absolute; top: 10px; right: 10px; padding: 2px 10px; border-radius: 10px; font-size: 10px; background: rgba(255,255,255,0.25); color: #fff; letter-spacing: 1px; writing-mode: horizontal-tb; }
.book-cover .upload-badge { position: absolute; top: 10px; left: 10px; padding: 2px 8px; border-radius: 8px; font-size: 9px; background: rgba(231,76,60,0.85); color: #fff; letter-spacing: 1px; writing-mode: horizontal-tb; }
.book-cover .rating-badge { position: absolute; bottom: 8px; left: 10px; padding: 3px 10px; border-radius: 10px; font-size: 12px; background: rgba(0,0,0,0.6); color: var(--star); font-weight: bold; writing-mode: horizontal-tb; letter-spacing: 0; }
.book-cover .rating-badge .rating-num { font-size: 16px; }
.book-cover .rating-badge .rating-count { font-size: 9px; color: #ccc; }
.book-info { padding: 16px; }
.book-info h3 { font-size: 17px; margin-bottom: 4px; color: var(--text); }
.book-info .author { font-size: 12px; color: var(--text2); margin-bottom: 8px; }
.book-info .desc { font-size: 12px; color: var(--text2); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.progress-bar { height: 3px; background: var(--divider); border-radius: 2px; margin-top: 10px; }
.progress-bar .fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s; }
.progress-label { font-size: 10px; color: var(--text2); margin-top: 3px; text-align: right; }
mark { background: #ffe082; color: #333; padding: 0 1px; border-radius: 2px; }
:root[data-theme="dark"] mark { background: #5a4a20; color: #ffe082; }

/* ====== Reader ====== */
#reader { display: none; height: calc(100vh - 52px); }
#reader.active { display: flex; }
#bookshelf.hidden { display: none; }
#sidebar { width: 260px; min-width: 260px; background: var(--sidebar); border-right: 1px solid var(--divider); display: flex; flex-direction: column; transition: margin-left 0.3s; }
#sidebar.collapsed { margin-left: -260px; }
.sidebar-header { padding: 16px; border-bottom: 1px solid var(--divider); display: flex; align-items: center; justify-content: space-between; }
.sidebar-header h3 { font-size: 14px; color: var(--text); }
.sidebar-close { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 18px; padding: 2px 6px; }
.chapter-list { flex: 1; overflow-y: auto; padding: 8px 0; }
.chapter-item { padding: 10px 16px; cursor: pointer; font-size: 13px; border-left: 3px solid transparent; color: var(--text2); transition: all 0.15s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chapter-item:hover { background: var(--hover); color: var(--text); }
.chapter-item.current { color: var(--accent); font-weight: bold; border-left-color: var(--accent); background: var(--hover); }
.bookmarks-mini { border-top: 1px solid var(--divider); padding: 12px 16px; }
.bookmarks-mini h4 { font-size: 12px; color: var(--text2); margin-bottom: 8px; }
.bm-mini-item { font-size: 11px; color: var(--accent); cursor: pointer; padding: 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#content-area { flex: 1; overflow-y: auto; position: relative; }
.content-header { padding: 16px 24px; border-bottom: 1px solid var(--divider); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.content-header .book-title { font-size: 16px; font-weight: bold; color: var(--text); }
.content-header .chap-title { font-size: 13px; color: var(--text2); }
.content-body { max-width: 700px; margin: 0 auto; padding: 40px 32px 30px; }
.content-body .chapter-heading { text-align: center; font-size: 22px; font-weight: bold; margin-bottom: 32px; color: var(--text); }
.content-body .chapter-text { font-size: var(--font-size, 17px); line-height: var(--line-height, 2); text-align: justify; letter-spacing: 0.5px; }
.content-body .chapter-text p { text-indent: 2em; margin-bottom: 0.8em; }
.nav-bottom { max-width: 700px; margin: 0 auto; padding: 0 32px 20px; display: flex; justify-content: space-between; gap: 12px; }
.nav-btn { padding: 10px 24px; background: var(--card); border: 1px solid var(--cardBorder); border-radius: 8px; cursor: pointer; color: var(--text); font-family: inherit; font-size: 14px; transition: all 0.2s; }
.nav-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
.nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ====== Rating section ====== */
.rating-section { max-width: 700px; margin: 0 auto; padding: 0 32px 20px; border-top: 1px solid var(--divider); padding-top: 20px; }
.rating-section .rating-header { font-size: 15px; font-weight: bold; color: var(--text); margin-bottom: 8px; }
.rating-section .rating-current { font-size: 13px; color: var(--text2); margin-bottom: 10px; }
.rating-stars { display: flex; gap: 4px; flex-wrap: wrap; }
.rating-star { width: 32px; height: 32px; border-radius: 4px; border: 1px solid var(--divider); background: var(--bg); color: var(--text2); cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; font-family: inherit; }
.rating-star:hover, .rating-star.active { background: var(--star); color: #fff; border-color: var(--star); font-weight: bold; }
.rating-star.my-score { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ====== Comments section ====== */
.comments-section { max-width: 700px; margin: 0 auto; padding: 0 32px 40px; border-top: 1px solid var(--divider); padding-top: 20px; }
.comments-section .comments-header { font-size: 15px; font-weight: bold; color: var(--text); margin-bottom: 12px; }
.comment-form { display: flex; gap: 8px; margin-bottom: 18px; }
.comment-form textarea { flex: 1; padding: 10px; border: 1px solid var(--divider); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 13px; font-family: inherit; resize: vertical; min-height: 60px; outline: none; }
.comment-form textarea:focus { border-color: var(--accent2); }
.comment-form .comment-submit { padding: 8px 18px; border-radius: 8px; border: none; background: var(--accent); color: #fff; cursor: pointer; font-family: inherit; font-size: 13px; white-space: nowrap; align-self: flex-end; }
.comment-form .comment-submit:hover { opacity: 0.9; }
.comment-list { max-height: 400px; overflow-y: auto; }
.comment-item { padding: 12px 0; border-bottom: 1px solid var(--divider); }
.comment-item .comment-user { font-size: 13px; font-weight: bold; color: var(--accent); margin-bottom: 2px; }
.comment-item .comment-text { font-size: 13px; color: var(--text); line-height: 1.5; }
.comment-item .comment-time { font-size: 10px; color: var(--text2); margin-top: 4px; }

/* ====== Float toolbar ====== */
#float-toolbar { position: fixed; bottom: 32px; right: 32px; z-index: 50; display: flex; flex-direction: column; gap: 8px; }
.float-btn { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--cardBorder); background: var(--card); color: var(--text2); cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; box-shadow: 0 2px 8px var(--shadow); }
.float-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
#back-top { position: fixed; bottom: 100px; right: 32px; z-index: 50; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--cardBorder); background: var(--card); color: var(--text2); cursor: pointer; font-size: 16px; display: none; align-items: center; justify-content: center; box-shadow: 0 2px 8px var(--shadow); transition: all 0.2s; }
#back-top:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ====== Modals ====== */
.modal-overlay { display: none; position: fixed; inset: 0; z-index: 199; background: rgba(0,0,0,0.4); }
.modal-overlay.show { display: block; }
.modal-panel { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--card); border: 1px solid var(--cardBorder); border-radius: 16px; padding: 28px; z-index: 200; box-shadow: 0 12px 40px var(--shadow); width: 400px; max-height: 85vh; overflow-y: auto; }
.modal-panel.wide { width: 560px; }
.modal-panel.show { display: block; }
.modal-title { font-size: 20px; font-weight: bold; margin-bottom: 18px; color: var(--text); text-align: center; }
.modal-close { position: absolute; top: 12px; right: 16px; background: none; border: none; color: var(--text2); cursor: pointer; font-size: 20px; }
.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 4px; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 9px 12px; border: 1px solid var(--divider); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 13px; font-family: inherit; outline: none; resize: vertical; }
.form-group textarea { min-height: 80px; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent2); }
.form-error { color: #e74c3c; font-size: 12px; margin-top: 4px; min-height: 16px; }
.submit-btn { width: 100%; padding: 10px; border-radius: 8px; border: none; background: var(--accent); color: #fff; font-size: 15px; cursor: pointer; font-family: inherit; margin-top: 6px; transition: opacity 0.2s; }
.submit-btn:hover { opacity: 0.9; }
.switch-text { text-align: center; margin-top: 14px; font-size: 13px; color: var(--text2); }
.switch-text a { color: var(--accent); cursor: pointer; text-decoration: underline; }

/* Chapter editor in upload */
.chapter-editor { border: 1px solid var(--divider); border-radius: 8px; padding: 12px; margin-bottom: 10px; background: var(--bg); }
.chapter-editor .ch-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.chapter-editor .ch-header span { font-size: 12px; color: var(--text2); }
.chapter-editor .ch-header button { background: none; border: none; color: #c0392b; cursor: pointer; font-size: 14px; }
.add-chapter-btn { padding: 6px 16px; border: 1px dashed var(--divider); border-radius: 8px; background: none; color: var(--accent); cursor: pointer; font-size: 12px; font-family: inherit; width: 100%; }

/* Responsive */
@media (max-width: 768px) {
  #sidebar { width: 100%; min-width: 100%; position: fixed; top: 52px; left: 0; height: calc(100vh - 52px); z-index: 90; }
  #sidebar.collapsed { margin-left: -100%; }
  .content-body { padding: 24px 16px 20px; }
  #float-toolbar { bottom: 16px; right: 16px; }
  .modal-panel { width: 90vw; }
  .book-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
  #topbar { gap: 6px; }
  .search-wrap { max-width: 140px; }
  .rating-stars { gap: 2px; }
  .rating-star { width: 28px; height: 28px; font-size: 11px; }
}

.setting-opt { padding: 4px 12px; border-radius: 6px; border: 1px solid var(--divider); background: var(--bg); color: var(--text2); cursor: pointer; font-size: 12px; font-family: inherit; transition: all 0.15s; }
.setting-opt:hover { border-color: var(--accent2); }
.setting-opt.selected { background: var(--accent); color: #fff; border-color: var(--accent); }

/* Author actions on book card */
.author-actions { position: absolute; bottom: 8px; right: 8px; display: flex; gap: 4px; z-index: 2; }
.author-actions .aa-btn { padding: 3px 8px; border-radius: 6px; border: none; cursor: pointer; font-size: 10px; font-family: inherit; color: #fff; transition: opacity 0.2s; }
.author-actions .aa-btn:hover { opacity: 0.85; }
.author-actions .aa-edit { background: #3498db; }
.author-actions .aa-del { background: #c0392b; }
.book-card { position: relative; }

/* Errata section */
.errata-section { max-width: 700px; margin: 0 auto; padding: 0 32px 20px; border-top: 1px solid var(--divider); padding-top: 20px; }
.errata-section .errata-header { font-size: 15px; font-weight: bold; color: var(--text); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.errata-item { padding: 10px 0; border-bottom: 1px solid var(--divider); }
.errata-item .errata-meta { font-size: 11px; color: var(--text2); margin-bottom: 4px; }
.errata-item .errata-desc { font-size: 13px; color: var(--text); line-height: 1.5; }
.errata-item .errata-suggestion { font-size: 12px; color: var(--accent); margin-top: 4px; }
.errata-item .errata-actions { margin-top: 6px; display: flex; gap: 6px; }
.errata-status { display: inline-block; padding: 2px 8px; border-radius: 8px; font-size: 10px; }
.errata-status.open { background: #e74c3c20; color: #e74c3c; }
.errata-status.fixed { background: #2ecc7120; color: #2ecc71; }
</style>
</head>
<body>

<!-- ====== Topbar ====== -->
<nav id="topbar">
  <span class="logo" onclick="goBookshelf()">云中书阁</span>
  <div class="search-wrap"><span class="search-icon">🔍</span><input type="text" id="search-input" placeholder="搜书名、作者..." oninput="onSearch()"></div>
  <div class="right-btns" id="topbar-right">
    <button class="top-btn upload-btn" onclick="showUploadModal()">📝 投稿</button>
    <button class="top-btn" onclick="showAuthModal('login')" id="btn-login">登录</button>
    <button class="top-btn" onclick="showAuthModal('register')" id="btn-register">注册</button>
    <div class="user-dropdown" id="user-dropdown" style="display:none">
      <button class="top-btn primary" onclick="toggleUserMenu()" id="btn-user">👤 <span id="username-display"></span></button>
      <div class="dropdown-menu" id="user-menu">
        <div class="dm-item" onclick="showUploadModal()">📝 我要投稿</div>
        <div class="dm-item" onclick="showBookshelf()">📚 我的书架</div>
        <div class="dm-item" onclick="showBookmarks()">📑 我的书签</div>
        <div class="dm-item" onclick="logout()">🚪 退出登录</div>
      </div>
    </div>
    <button class="top-btn" onclick="toggleSidebar()" id="btn-toc" style="display:none">📖 目录</button>
    <button class="top-btn" onclick="showBookmarks()" id="btn-bm" style="display:none">🔖 书签</button>
    <button class="top-btn" onclick="showSettings()">⚙ 设置</button>
  </div>
</nav>

<!-- ====== Bookshelf ====== -->
<div id="bookshelf">
  <h1>📚 云中书阁</h1>
  <p class="subtitle">一卷在手，天下我有</p>
  <div id="category-tabs"></div>
  <div style="text-align:center;margin-bottom:20px">
    <button class="top-btn" onclick="showBookshelf()" style="font-size:14px;padding:8px 20px">📚 我的书架</button>
  </div>
  <div class="recommended-section" id="recommended-section" style="display:none"></div>
  <div class="book-grid" id="book-grid"></div>
  <div class="no-results" id="no-results" style="display:none">没有找到匹配的小说</div>
  <!-- Bookshelf view -->
  <div id="bookshelf-view" style="display:none">
    <h2 style="text-align:center;color:var(--text);margin-bottom:4px">📚 我的书架</h2>
    <p style="text-align:center;color:var(--text2);font-size:13px;margin-bottom:20px" id="bookshelf-count"></p>

<script>
// ==================== SHA-256 (native crypto API) ====================
async function sha256(str) {
  const encoder = new TextEncoder();
  const data = encoder.encode(str);
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

const BUILTIN_NOVELS = [
  {id:'xingchen',title:'星辰之下',author:'凌云',category:'scifi',desc:'在遥远的未来，人类文明已经遍布银河系。一个普通的星际快递员，偶然发现了一个惊天秘密，从此踏上拯救文明的旅程。',chapters:[
    {id:'ch1',title:'第一章  平凡的快递员',content:['银河历3157年，人类已经在银河系中建立了庞大的星际文明。数千颗星球上都有人类的足迹，而连接这一切的，是遍布星海的虫洞网络。','陆辰是"星辰快递"公司的一名普通员工，每天的工作就是驾驶他那艘破旧的货运飞船"铁壳号"，在各个星球之间运送包裹。','这份工作没什么前途，但胜在稳定。陆辰今年二十五岁，从十八岁拿到星际航行执照开始，已经干了七年快递员。他去过上百颗星球，却从未真正在哪颗星球上停留超过三天。','"铁壳号，启动自检程序。"陆辰拍了拍控制台，老旧的飞船发出嘎吱嘎吱的响声，引擎有气无力地嗡鸣着，像是一个还没睡醒的老人。','今天他要送的是一批从地球母星寄出的特殊货物——据说是一些科研样本，收货方是位于猎户座边缘的"深空七号"实验站。这批货物的运费高得离谱，但陆辰也懒得多问。干快递这行，少问多送是基本原则。','飞船缓缓驶离了空港，进入了虫洞通道。窗外是扭曲的星光，如同流动的颜料。陆辰把座椅放倒，准备打个盹——虫洞航行大概需要六个小时。','然而，就在他即将入睡的时候，一阵急促的警报声突然响起。货舱里，有什么东西在发光。']},
    {id:'ch2',title:'第二章  发光的货物',content:['陆辰猛地从座椅上弹起来，差点撞到天花板。警报器尖叫着，货舱方向的温度传感器显示温度正在急剧升高。','"该死！"他骂了一声，手忙脚乱地打开了货舱监控。屏幕上，一个标着"S级机密"的密封箱正在发出幽蓝色的光，箱体周围的温度已经上升到了三百度，而且还在继续升高。','陆辰赶紧启动了货舱的冷却系统，但毫无效果。那个密封箱的光芒越来越强，最后——伴随着一声清脆的碎裂声——箱子裂开了一道缝。','光芒从缝隙中涌出，如同液态的星辰。陆辰目瞪口呆地看着监控画面，一个透明的人形轮廓从光芒中浮现。','它看起来像一个年轻女子，但身体完全由光构成，半透明的轮廓闪烁着星辉。她缓缓睁开了眼睛——那眼睛里仿佛装着整个银河。','"不要害怕。"一个声音直接在陆辰的脑海中响起。"我需要你的帮助。"','陆辰在太空中跑了七年快递，见过不少奇奇怪怪的东西，但一个会说话的光之生命体？这绝对是头一回。"你……你是什么？"他声音有些发颤。','"我是星灵——一个由恒星的量子意识凝聚而成的生命。有人正在猎杀像我这样的存在，我需要你帮助我找到其他星灵，阻止这场屠杀。"']},
    {id:'ch3',title:'第三章  猎手',content:['陆辰花了好一会儿才让自己相信这不是在做梦。星灵——自称"瑶光"的存在——用她那种直接传入意识的方式，向他解释了事情的来龙去脉。','银河系中有极少数恒星在漫长岁月中产生了量子层面的意识——这便是星灵。它们原本各自沉睡在自己的恒星中，直到最近，一个名为"猎星者"的神秘组织开始用某种技术捕获和抽取星灵的能量。','"他们的目标是利用星灵的能量制造一种前所未有的大规模杀伤性武器。"瑶光说，"我所在的恒星——天璇星——已经被他们摧毁了。我是少数逃脱的星灵之一。"','陆辰挠了挠头。"可是我只是一个快递员啊，我能做什么？"','"瑶光"的光芒闪烁了一下，似乎在笑。"正因如此。没有人会注意一个普通的快递员。你可以自由穿行于各个星系，而不会引起猎星者的怀疑。我需要你带我去找其他的星灵，在他们被猎杀之前发出警告。"','就在这时，"铁壳号"的雷达突然发出了尖锐的警报——三艘无标识的黑色战舰正在快速逼近，它们船身上的能量炮已经开始充能。','"他们来了。"瑶光的声音第一次带上了恐惧。"猎星者发现我了。"','陆辰咬紧了牙关。他这辈子从没开过战斗机，也从没参加过任何战斗。但现在，他别无选择。他一把抓住操纵杆，将引擎功率推到最大。"坐稳了！"']},
    {id:'ch4',title:'第四章  星门',content:['陆辰从未像此刻这样专注过。他的双手紧握操纵杆，指节因为用力而发白。"铁壳号"的引擎发出了濒临极限的嘶吼声，船身在剧烈的震荡中嘎吱作响。后方三艘猎星者战舰的炮火如暴雨般倾泻而来，能量束擦过船壳时发出刺耳的尖啸。','"它们太快了！"陆辰吼道。瑶光化作一道光芒，悬浮在驾驶舱中央，她的声音依旧平静，但语速明显加快了："前方三千公里处有一个未登记的虫洞入口。如果能在被击中前抵达，我们就能甩掉它们。"','陆辰瞥了一眼导航屏幕——三千公里，以"铁壳号"当前的速度，至少需要两分钟。而追兵的火力越来越密集，左侧护盾已经降到了百分之三十。"能不能干扰它们的瞄准系统？"他问。瑶光的身影忽然变得明亮了许多。"交给我。"说罢，她化作一道光束，穿透舱壁消失在了货舱方向。片刻之后，陆辰听到了货舱里传来一阵低沉的嗡鸣声。紧接着，追兵的火力突然失去了准头——所有的能量束都偏离了至少两百米。','"那箱子里原来装的是什么？"陆辰忍不住问。瑶光的声音再次在脑海中响起："一个微型量子干扰器。猎星者原本想用它来捕获我，但被我逆转了原理。"前方，虚空中忽然裂开了一道缝隙——那便是虫洞入口。陆辰咬牙将引擎推到了极限，"铁壳号"如一道流星般扎了进去。']},
    {id:'ch5',title:'第五章  陌生的星系',content:['虫洞的出口在一颗蓝色恒星的轨道上。这里不是任何已知的星域——导航星图上没有这颗恒星的记录，也没有任何人类文明的信号。陆辰把"铁壳号"停在一颗小行星的阴影里，关闭了所有主动信号发射器。','"这里是哪里？"他问瑶光。瑶光沉默了片刻——陆辰渐渐习惯了这种沉默，那是她在感知周围的空间。"我不知道。但离这里很近的另一颗恒星中，有一个我的同族在沉睡。"她的声音里带着一丝陆辰从未听过的情绪——那是希望。','陆辰长出了一口气，靠在座椅上。他的手还在发抖。刚才那一连串躲避动作，比他过去七年的飞行经验加起来还要惊险。"瑶光，"他说，"你得告诉我全部真相。猎星者到底是什么人？他们为什么要猎杀星灵？如果你要我帮你，我需要知道一切。"','瑶光的身影缓缓凝聚在副驾驶座上。她的光芒比之前暗淡了一些，但依旧如同流动的星辉。她看着陆辰，那双装着银河的眼睛里，闪过一丝悲伤。"猎星者——他们是人类。"她轻声说。"但不是普通的人类。他们是一千年前离开地球的那批人。"陆辰猛地坐直了身体。"你是说……殖民纪元时期的远征舰队？""是的。"瑶光说。"他们没有死。他们找到了比虫洞更强大的力量——将星灵转化为武器的技术。而现在，他们回来了。"']},
    {id:'ch6',title:'第六章  盟友',content:['陆辰花了好几分钟消化这个信息。一千年前，人类派出了九支远征舰队，试图在银河深处建立殖民地。这九支舰队在出发后十年陆续失去了联系，最终被官方宣布为"全员罹难"。历史课本上就是这么写的。但如果瑶光说的是真的，那支舰队不仅活了下来，还发展出了足以威胁整个银河文明的力量。','"我们需要帮手。"陆辰站起身，走向驾驶舱后方的通讯台。"我认识一些人。""人类不会相信你的。"瑶光说。"他们会的。"陆辰打开了一个加密频道——这是他跑快递七年积累下来的人脉。频道接通了，一个沙哑的声音传出："陆辰？你小子还活着？听说猎星者在追你。"','陆辰愣了一下——消息传得比他想象的快得多。"老独眼，"他对着通讯器说，"我需要你的帮助。你还欠我一次。"通讯那头沉默了片刻。"你知道你在卷进什么事情吗？猎星者已经发布了你的通缉令，赏金是五百万星币。整个猎户座星域的猎人都疯了。"','陆辰看了看身旁的瑶光。她的光芒在昏暗的驾驶舱里安静地闪烁着，像一颗孤独的恒星。他深吸了一口气。"我知道。但我手里的秘密，比五百万值钱得多。我们在老地方见面。"他关掉了通讯器，回到了驾驶位上。瑶光看着他，沉默了很久。"为什么？"她最终问道。"你本可以把我交出去，领取赏金。这是人类常做的事。"陆辰启动了引擎，嘴角浮起一丝笑意。"因为我是个快递员。我的工作是把东西送到该去的地方——而你，还没有到达目的地。"']}
  ]},
  {id:'jiangnanyu',title:'江南雨',author:'苏晚',category:'romance',desc:'民国初年的江南小镇，一位留学归来的青年与一位绣坊女子在烟雨中相遇。时代的浪潮之下，两个人的命运如雨丝般交织缠绵。',chapters:[
    {id:'ch1',title:'第一章  烟雨归人',content:['民国六年，三月的江南。','细雨如丝，密密地织着。青石板路被雨水浸得发亮，倒映着两岸白墙黛瓦的轮廓。空气中弥漫着栀子花和新翻泥土的气息，还有河面上飘来的若有若无的橹声。','沈清和站在乌篷船上，撑着一把油纸伞。船缓缓穿过石拱桥的桥洞，桥上有卖花的小姑娘提着竹篮匆匆跑过，留下一串清脆的木屐声。','他是前年去的日本，在早稻田大学念了两年的政治经济。如今毕业归来，家里已经在镇上给他谋了一份差事——在县里的教育科做个科员。不算什么大官，但在这样的小镇，也算体面。','"少爷，到了。"船家老杨把橹一收，船身微微晃了晃，靠在了埠头上。','沈清和提着藤箱上了岸。码头边上是一家绣坊，门楣上挂着一块匾额，写着"锦华绣庄"四个字。门半掩着，透出昏黄的灯光和绣娘们细细的说话声。','他正要往前走，门忽然开了。一个穿着月白色旗袍的年轻女子走了出来，手里端着一盆水。她看见门口站着一个陌生的年轻人，微微怔了一下，随即侧身让开。','"先生请进。"声音轻得像落在水面的雨滴。','沈清和摇了摇头，刚要解释，那女子已经把门推开了大半，引着他往里走。他这才看清她的模样——约莫十八九岁，眉眼清秀，头发挽了个简单的髻，素净得像一幅水墨画。','沈清和忍不住笑了。"我不是来订绣品的。只是路过，在门口站了站。"','那女子抬起眼，这才发现自己闹了个误会。她的脸微微红了，但并未慌乱，只是合上账簿，淡然道："那是我冒昧了。先生慢走。"','沈清和点了点头，转身离开。走出几步，忍不住回头看了一眼，恰好对上她的目光。她很快低下头去，像受惊的雀儿。']},
    {id:'ch2',title:'第二章  锦华绣庄',content:['沈清和在教育科安顿下来之后，才知道那个绣坊女子的名字叫苏浣纱——一个很有诗意的名字，"浣纱"二字，像是从古诗里走出来的。','锦华绣庄是苏家的产业，苏浣纱的父亲苏锦堂是镇上最好的绣工。可惜苏老爷子上个月中风瘫了，绣庄的生意便全落在了苏浣纱和两个小徒弟身上。','沈清和借着教育科要采购一批锦旗的名义，第二次踏进了锦华绣庄。这次他倒是真的来订东西的，只不过原本这事随便派个科员来就行，他却偏偏亲自来了。','苏浣纱见了他，先是愣了一下，随即认出了他。"是你？"','"是我。"沈清和笑着说，"这回真是来订货的——教育科要做二十面锦旗，表彰优秀教员。听说你家绣工最好。"','苏浣纱翻开账簿，认真地记下了规格和数量。她写字的时候，额前一缕碎发垂下来，随着她的呼吸微微晃动。沈清和发现自己一直在盯着那缕头发看，连忙移开了目光。','谈完正事，沈清和没有急着走。他看着墙上挂着的一幅苏绣，那是一幅"烟雨江南"——针脚细密，色彩柔和，雨丝从檐角垂落的感觉被绣得活灵活现。','"这幅是谁绣的？"他问。','"是我。"苏浣纱说，语气平淡，但眼睛里多了一丝光彩。"绣了三个月。"','"很美。"沈清和由衷地说。"江南的雨，就该是这个样子。"','苏浣纱看了他一眼，似乎在判断他这话是客套还是真心。片刻后，她轻轻说了声"谢谢"，声音比刚才柔和了许多。','从那天起，沈清和成了锦华绣庄的常客。有时是来订东西，有时什么也不订，只是带一包桂花糕，坐下来看她们绣花。']},
    {id:'ch3',title:'第三章  流言',content:['从那天起，沈清和在教育科的差事之余，几乎所有空闲时间都消磨在了绣庄里。镇上的人渐渐看出了端倪。先是那个常年在桥头卖馄饨的王婆子，每次沈清和从桥上经过，她就抿着嘴笑，嘴里念叨着"沈先生又去绣庄啦"。然后是绣庄隔壁的茶馆老板，每次看到沈清和，都不声不响地给他留一张靠窗的位置——那个位置恰好能看到绣庄的门。','沈清和不在乎这些闲话。他是留过洋的人，在日本见识过新式学堂和新式思想，对于小镇上这些闲言碎语，他自有主意。但苏浣纱在乎。她从小在这个镇上长大，绣坊的门面就是苏家的脸面。有一回，沈清和又带着桂花糕来的时候，她低着头绣花，半晌才开口："沈先生，以后还是少来些吧。"沈清和把桂花糕放在桌上，语气认真起来："苏姑娘，我沈清和做事，从来不依别人的闲话。你也不必。"他没有再多说什么，只是静静地坐在那里，看着窗外的雨。']},
    {id:'ch4',title:'第四章  变故',content:['四月的江南，雨渐渐多了起来。教育科的事情也多了——新县长上任，要整顿全县的学堂。沈清和整日忙着统计学生人数和教员编制，有半个月没去绣庄。等他终于忙完手头的事情，却发现锦华绣庄的门紧闭着。他问了隔壁茶馆的老板，老板摇着头说苏老爷子前日过世了，苏浣纱一个人操办丧事，绣庄已经关了三天了。沈清和心里一沉，转身就往苏家走。','苏家在镇子的最西边，是一栋两进的老宅子。门口挂着白布，院里有隐约的哭声传来。沈清和站在门外，犹豫了一下，最终还是推门进去了。灵堂很简陋，苏浣纱跪在蒲团上，穿着孝服，人瘦了一圈，眼睛红红的。看到沈清和进来，她愣住了。沈清和没有说话，只是走到灵前，恭恭敬敬地磕了三个头。然后他站起身，走到苏浣纱面前，轻声说："我来帮忙。"','那天晚上，沈清和回家经过码头的时候，遇到了一个意想不到的人——他的同窗好友，如今在县警察局做副局长的周文渊。周文渊拉着他到路边的馄饨摊坐下，面色凝重地对他说："清和，最近镇上不太平。你少往苏家跑。""什么意思？"沈清和警觉起来。"有人盯上绣庄那块地了。来头不小。"']},
    {id:'ch5',title:'第五章  暖春',content:['周文渊的话像一根刺，扎在了沈清和心里。第二天一早，他就去了县里的档案室，调出了锦华绣庄的房契和地契记录。苏家在这块地上已经经营了三代人，按理说地契清晰，不应该有什么问题。但沈清和仔细翻阅之后发现了一个不对劲的地方——三个月前，有一份文书以"市政规划"的名义将绣庄所在的那条街划入了拆迁范围，公文是省城直接下来的，绕过了县里。沈清和心里一沉——能在省城运作这种事的人，来头确实不小。','临行前，他去了一趟绣庄。苏浣纱已经重新开业了，独自一人在绣架前忙碌着。看到沈清和，她的脸上掠过一丝不易察觉的欢喜，但很快又恢复了平静。沈清和没有告诉她自己的打算，只是照常买了一幅小小的兰花绣品，然后说了句"等我回来"。苏浣纱目送他走出巷口，手里还握着针，却半天没有绣下一针。','三天后，沈清和从省城回到了小镇。他带回来一份文件——一份能证明绣庄地块不在拆迁范围内的正式批文。为了这份文件，他跑了省建设厅、民政厅，甚至动用了早稻田时期的校友关系。当他走进绣庄，把文件放到苏浣纱面前时，苏浣纱看了很久，然后抬起头，眼睛里有一种沈清和从未见过的光芒。"你为什么要做这些？"她问。沈清和笑了，笑容里带着疲惫，但更多的是坦然。"因为我不想让这个地方消失。这里的每一幅绣品，都该被好好地留下来。"他顿了顿，看着苏浣纱："也包括你。"窗外的天光渐渐沉了下去，绣庄里的灯火亮了起来，将两个人的影子投在墙上。也许明天还会有雨，但这一刻，春天的江南终于是暖的了。']}
  ]},
  {id:'jianying',title:'剑影',author:'萧尘',category:'wuxia',desc:'一柄残剑，一卷残谱，一个被灭门的少年。十年蛰伏，一朝拔剑，天下谁人不识君？江湖风云再起，恩怨情仇尽在剑影之中。',chapters:[
    {id:'ch1',title:'第一章  灭门之夜',content:['那一夜，月如银盘，照得青云山庄的琉璃瓦泛着寒光。','十二岁的叶无锋是被他师父从被窝里拖出来的。他还没弄清楚怎么回事，就听到外面传来惨叫声和兵刃相交的刺耳声响。师父的手冰凉，按着他的肩膀，声音沙哑而急促："不要出声，跟我走。"','他们穿过密道，身后是越来越远的厮杀声。叶无锋回头看了一眼，透过密道的缝隙，他看到父亲挥舞着青云剑奋力抵抗，母亲护着年幼的妹妹缩在墙角。然后——一道剑光闪过。','他再也看不到更多了。师父捂住他的眼睛，拖着他消失在漆黑的密道里。','那一夜，青云山庄满门一百二十三口，只有他一个人活了下来。','——','十年后，江湖上多了一个无名剑客。没有人知道他的来历，只知道他用的是一柄锈迹斑斑的残剑，剑法却凌厉异常。他四处挑战各大门派，从无败绩。','他从不报姓名，但江湖人给他起了个绰号——"残剑"。','"这剑以前断过。"有人说。','"我听说，十年前青云山庄灭门案里，庄主叶青天的佩剑就是断的。"另一个人压低了声音。','说这话的人第二天被发现死在了客栈的床上。胸口一个剑孔，干净利落，没有一滴多余的血。凶手的手很稳。','官府查了半个月，什么都没有查到。但所有人都知道，那把剑的主人，回来了。']},
    {id:'ch2',title:'第二章  江南风雨楼',content:['风雨楼是江南最大的江湖势力，楼主"铁掌"韩震山，一双铁砂掌打遍江南无敌手。这些年他广收门徒，势力遍布江南七州，黑白两道都要给他几分薄面。','叶无锋站在风雨楼宏伟的门楼前，抬头看着那块烫金匾额。十年前的灭门之夜，他曾亲眼看见一个使铁砂掌的黑衣人一掌劈开了山庄的大门。他在暗处躲了十年，追查了十年，所有的线索都指向了这里。','"来者何人？"守门的两个大汉挡住了他的去路，看了看他腰间的残剑，露出不屑的笑容。"哪里来的乞丐，这把破剑也敢拿出来丢人？"','叶无锋没有答话。他只是微微动了一下手腕。','寒光一闪，两个大汉腰间的佩剑齐根而断，断口光滑如镜。他们甚至没有看清他是如何出剑的。','叶无锋从他们中间走过，声音冰冷："告诉韩震山，故人之子来访。"','风雨楼的大堂里，韩震山正坐在太师椅上喝茶。他五十岁上下，身形魁梧，一双大手骨节粗大，确实是练铁砂掌的高手。','但当韩震山踏进偏厅的那一刻，他愣住了。叶无锋站在那里，手中那柄残剑在烛光下泛着幽幽的寒光。','"这把剑……"韩震山的瞳孔猛然收缩。"你是叶青天的什么人？"','"他是我父亲。"叶无锋一字一顿地说。"十年前，你灭我满门。今日，我来讨这笔血债。"','韩震山沉默了很久。然后，他苦笑了一声。"孩子，你找错人了。"']},
    {id:'ch3',title:'第三章  半枚玉佩',content:['叶无锋握剑的手微微一震。他死死盯着韩震山，试图在那张布满风霜的脸上找到一丝心虚或伪装的痕迹。但韩震山的眼睛里只有一种复杂的神情——那是愧疚，但不是凶手面对死者家属的那种愧疚。"什么意思？"叶无锋的声音低沉得像是从冰层下面传上来的。韩震山缓缓坐回太师椅，招手让手下都退了出去。偏厅里只剩下两个人。他沉默了很长时间，才开口说道："当年参与攻打青云山庄的，确实有我们风雨楼的人。但主使不是我。有人冒充风雨楼的名义，参与了灭门。"','叶无锋的剑又往前递了一寸，剑尖抵住了韩震山的咽喉。"谁？"他一字一顿地问道。韩震山没有躲闪，只是平静地看着他。"你父亲在出事之前，曾经派人送过一封信给我。信上说，他掌握了一个秘密——关于朝廷有人暗中资助邪教组织，意图谋反。但信还没送到我手上，青云山庄就出事了。"随即韩震山从袖子里摸出了一块玉——那是一枚只有一半的玉佩，断面参差不齐，上面刻着一个残缺的字。叶无锋认出了那个字——"影"。']},
    {id:'ch4',title:'第四章  追影',content:['叶无锋收回了剑。他将那半枚玉佩翻来覆去地看了许久。玉佩的材质是上好的和田玉，温润细腻，断面处有明显的人为掰断的痕迹。"另一半在谁手里？"他问。韩震山摇了摇头。"我不知道。但据我所知，当年参与灭门的人中，有一个使长剑的高手——他的剑法快得连风雨楼最好的剑客都看不清。江湖上这样的人，一只手数得过来。"叶无锋心里忽然闪过一个念头。十年前的那一夜，他确实看到了一双眼睛——那双眼睛在夜色中如同寒星，冷漠得不像人类。','他告别了韩震山，离开了风雨楼。江南用剑的高手中，最出名的有三个：剑圣林天南的嫡传弟子苏流云、皇家禁军前任剑术教头百里寒、以及十年前突然在江湖上消失的神秘剑客——影剑。影剑的"影"，和玉佩上的"影"字，不会是巧合。叶无锋沿着影剑在江湖上留下的蛛丝马迹一路追查。影剑最后一次公开出手，是在十二年前——在京城的天波楼，他与当时的武林盟主大战三百回合，不分胜负。后来武林盟主忽然宣布退隐，影剑也随之销声匿迹。']},
    {id:'ch5',title:'第五章  古刹',content:['叶无锋发现了一个关键的线索——影剑最后一次出没的地方，距离青云山庄只有三百里。而且那个时间点，恰好是灭门之夜的前三天。他顺着这条线继续往下挖，终于在江南一座偏僻的古庙里找到了一个当年的目击者——一个瞎了一只眼的老和尚。"施主问的是十年前那个带剑的施主？"老和尚盘坐在蒲团上，脸上的表情像是在追忆久远的梦境。"他来过。他在佛前跪了三天三夜。然后……他放下了一样东西。"老和尚颤巍巍地站起身，从佛像背后掏出了一个包裹——打开之后，叶无锋愣住了。里面是一柄完整的剑，剑身和剑柄严丝合缝——与他腰间的那柄残剑，恰好是同一把。']},
    {id:'ch6',title:'第六章  青云',content:['叶无锋将两把剑拼在一起。断口完全吻合，剑身上刻着的一行小字也终于完整了——"青云直上，剑影相随"。这是他父亲叶青天的佩剑。完整的青云剑。当年灭门之夜，叶青天的剑被人斩断——但能将这把百炼精钢铸就的名剑斩断的，只有另一把同样锋利的剑。而那把剑的主人……"他留下了什么话吗？"叶无锋问老和尚。老和尚点了点头，缓缓说了一句话。叶无锋听完，在原地站了很久。他想起师父教他剑法的时候说过："剑道的最高境界，不是战胜别人，而是看清自己。"他一直以为这句话是在教导他不要被仇恨蒙蔽双眼。但此刻他才明白——师父的意思，远比这个深得多。叶无锋将完整的青云剑收回鞘中，向老和尚深深鞠了一躬，转身离开了古庙。他要去寻找那个放下剑的人。江湖上的人都说影剑早已死了，但叶无锋知道，他只是藏起来了。而想要让一个人从藏身处走出来，唯有让他听到——青云剑重新出现的声音。']}
  ]},
  {id:'shierlou',title:'第十二层楼',author:'墨白',category:'mystery',desc:'深夜的写字楼里，保安老周发现电梯总是莫名停在并不存在的第十二层。一桩桩诡异事件背后，隐藏着一个令人窒息的真相。',chapters:[
    {id:'ch1',title:'第一章  不存在的楼层',content:['老周在这栋写字楼做了十五年保安。他熟悉这里的每一个角落——地面停车场有二百三十七个车位，地下车库有三层，大楼一共十一层。','是十一层，不是十二层。','但最近一个月，监控室的电梯显示屏上，每到凌晨两点四十七分，电梯就会自动从十一楼往上走一格。屏幕上会短暂地出现一个"12F"的字样，闪烁三次，然后电梯回到一楼。','老周第一次看到的时候，以为是系统故障。他打了报修电话，维修工来了三次，换了主板，换了线路，问题依旧。','"周师傅，这楼真没有十二层？"维修工第四次来的时候，脸色已经不太对了。','"我在这儿十五年，这楼几层我还能不知道？"老周有些不耐烦，但心里也在发毛。他翻看了施工图纸，物业档案，甚至找了当年的开发商。所有资料都表明：这栋楼只有十一层。','但监控不会说谎，至少他之前是这么认为的。','这天夜里，老周决定亲自去看看。凌晨两点四十分，他走进电梯，按下了十一楼的按钮。电梯缓缓上升，数字一格一格跳动着。老周攥紧手电筒，手心全是汗。','电梯停在了十一楼。门开了，外面是正常的走廊，应急灯发出昏黄的光，空无一人。','老周松了口气。但就在这时，电梯门关上了，而他的手还没来得及按下任何按钮。','数字继续跳动了——"12"。门再次打开的时候，外面不是走廊。']},
    {id:'ch2',title:'第二章  三十七张照片',content:['老周看到一个房间。一个不应该存在于这栋楼里的房间。灯光昏暗，像是医院手术室的那种冷白色的光。房间里摆满了办公桌和文件柜——但桌上积满了灰尘，墙上挂着的日历停在了二零零七年的六月。老周下意识地握紧手电筒，踏进了这个空间。身后的电梯门在他踏入的瞬间就关上了，发出一声沉闷的金属撞击声。他试着按了一下电梯的呼叫按钮，没有反应。手电筒的光扫过那些办公桌，照亮了一些零散的物品：一本翻开的记事簿、一个落满灰的马克杯、还有一件搭在椅背上的外套——像是有人刚刚才离开，又像是已经离开了很多年。','老周走近那张办公桌，拿起记事簿。上面写着密密麻麻的字，最后一页只有一行，笔迹潦草却用力很重："三十七个人全都出不去了。我是最后一个。如果有人看到这段话——不要按下十二楼。永远不要。"老周的手开始发抖。他把记事簿放回桌上，转身想找出口。但在这时，他听到了声音——从走廊的尽头传来，像是有人在低声说话，又像是风的呜咽。他循着声音走过去，拐过一个弯，看到了一扇半开的门。他推开门——里面是一个更大的房间，墙上整整齐齐地贴着三十七张照片。照片上的面孔，有些是他认得的——这栋楼之前消失过的人。']},
    {id:'ch3',title:'第三章  前人',content:['老周不是第一个发现第十二层的人。三年前，保洁员刘姐在深夜打扫时，电梯也曾短暂地停在了十二楼。她当时吓坏了，第二天就辞了职，从此再也没有消息。两年前，写字楼里一家公司的职员加班到深夜，监控同样拍到了电梯在十二楼开门——但他第二天对所有人说那是监控坏了。所有发现过第十二层的人，要么离开了，要么消失了。老周想起了去年失踪的那个保安——他值夜班之后再也没出现过。大家都说他可能是回了老家，但没有人真正去查证过。','老周强迫自己回到那个贴满照片的房间。那三十七张照片的背后，每一张都写着日期——最早的一张是二十年前。二十年前，这栋楼还没有建成。老周忽然明白了什么。他转身冲出房间，沿着漆黑的走廊跑回了电梯口。他疯狂地按着按钮，电梯没有任何反应。他开始用拳头砸门——最后，电梯门缓缓打开了。里面站着一个穿白衣服的人影。它没有五官，只是一个模糊的白色轮廓。它伸出手，递过来一张纸。老周颤抖着接了过来，纸上写着一行字："三十七个人都找齐了。你可以走了。"']},
    {id:'ch4',title:'第四章  不会忘记',content:['电梯忽然急速下坠。失重感让老周差点瘫倒。当电梯重新在一楼打开时，早晨的阳光透过写字楼的玻璃幕墙照了进来。一切都正常：清洁工在拖地，白领们提着咖啡走进大堂。没有人注意到老周从电梯里走出来时脸上是什么表情。老周在值班室里坐了一上午。然后他做了一件事——他把监控室十二楼的记录全部清除了。不是因为害怕，而是因为他觉得，有些事不该让不该知道的人知道。但他把那张纸留了下来——那行字始终印在他脑海里。','老周知道了写字楼真正的秘密：不是在第十二层，而是在每一层。那些来这座大楼上班的人，每一个都在慢慢消失——先是从他们的生活中消失，然后再从别人的记忆里消失。等到连最后一个记得他们的人也忘记时，他们就会被永远困在第十二层。而那三十七个人，只是第一批。老周把那张纸贴在监控室的墙上，然后拿起笔，在下面添了一行字："我会记住你们。一个都不会忘。"']}
  ]},
  {id:'changhenge',title:'长恨歌',author:'柳青',category:'history',desc:'安史之乱前夕，长安城中暗流涌动。一个胡商、一个乐师、一个禁军统领，三人的命运在盛世末年轰然相撞，谱写一曲盛世的悲歌。',chapters:[
    {id:'ch1',title:'第一章  长安月',content:['天宝十三载，八月十五，长安。','这是大唐最繁华的年代。东西两市商贾云集，胡人牵着骆驼穿过朱雀大街，酒肆里传出琵琶和胡笳的合奏声。整座长安城像是一个永不落幕的盛宴，每个人都沉浸在盛世的幻梦中。','阿史那康站在西市口，看着眼前熙熙攘攘的人流。他是粟特人，十年前跟着父亲的商队来到长安，从此再也没有离开。如今他在西市开了一家香料铺，生意做得风生水起，连宫里的采买太监都时常光顾。','但今天，他不是来看生意的。他袖子里藏着一封信——一封来自范阳的信。','送信的人已经死了。死在长安城外的渭水河边，尸体上插着三支羽箭，箭杆上刻着范阳军的标记。','阿史那康不用拆信就知道里面写着什么。最近半年，西市的粟特商人一个接一个地消失，他们的铺子被查封，货物被充公。官府的说法是"勾结外敌"，但阿史那康知道真相远不止这么简单。','"康兄。"一个声音从他身后响起。阿史那康回头，看到了一张再熟悉不过的脸——李龟年，宫中第一乐师，玄宗的座上宾。','"李兄怎么来了？"阿史那康笑着迎上去，但那笑容很僵硬。','李龟年走到他身边，压低声音说了一句话。阿史那康的脸色瞬间变了。','"安禄山，反了。"']},
    {id:'ch2',title:'第二章  暗流',content:['阿史那康倒吸了一口凉气。安禄山拥兵二十万，坐镇范阳，节制河东、平卢两镇，是大唐最有权势的边将。他若反了，整个河北都将陷入战火。"消息可靠？"阿史那康低声问。李龟年拉着他走进了西市深处的一间茶肆。这间茶肆表面上卖的是江南的龙井，实际上是长安情报网络中一个不起眼的中转站——而李龟年，宫中第一乐师，正是这个网络的核心人物。"十天前，"李龟年用只有两个人能听到的声音说，"安禄山以讨伐杨国忠为名，在范阳誓师。号称二十万大军。范阳军已经过了黄河。"','阿史那康忽然想起了他袖子里那封信。他把信掏出来，递给李龟年。李龟年扫了一眼，脸色骤变。"这封信是谁给你的？""一个粟特商人。他已经死了。"李龟年将信纸凑近烛火，仔细看了片刻，然后闭上了眼睛。"安禄山在找一个人。一个能帮他说服西域诸国联手反唐的人。而那个人——就是你的父亲。"']},
    {id:'ch3',title:'第三章  粟特商人',content:['阿史那康的父亲——阿里不花——是粟特商团的首领，在安西四镇中有着举足轻重的影响力。安禄山早年在西域作战时曾与阿里不花有过一面之缘，深知粟特人的商路网络对战争的重要性。如果西域商路被叛军控制，大唐将失去对丝绸之路的掌控权。阿里不花拒绝了安禄山的拉拢。他的回答只有一句话："商人不参与战争。我们只搬运东西——不是尸体。"安禄山对此很不高兴。三个月后，粟特商团在范阳的所有货物被以通敌为名查封。又过了一个月，阿里不花在西域的商队据点被匪徒袭击，本人下落不明。','"我父亲现在在哪里？""没有人知道。"李龟年说。"但安禄山那边也在找他——而且他们比你更急。"这意味着阿里不花还活着——而且很可能掌握着能改变战局的东西。阿史那康攥紧了拳头。他在长安西市卖了十年的香料，却不知道父亲在范阳已经和安禄山对峙了整整一年。']},
    {id:'ch4',title:'第四章  北上',content:['安禄山的叛军势如破竹。从范阳到洛阳，唐军节节败退。长安城里却依然歌舞升平——玄宗每日在梨园听曲，杨贵妃亲手为乐工们调音。李龟年每天都去梨园奏乐，但他的琴声里有一种旁人听不出的焦灼——他每一次弹琴，都在把前线传来的情报用暗语编入曲谱之中。阿史那康决定离开长安。他要去找他的父亲——不是去救战局，而是去尽一个儿子的本分。','临行前，他把自己在西市的香料铺子留给了最信任的徒弟。关门的时候，他看到铺子门口的青石板上刻着一行波斯文——那是父亲当年刻下的：愿香料庇护来往之人。从此长安西市再无阿史那康——只有粟特商道上多了一个昼夜兼程的旅人。他骑了一匹快马，出了长安西门，穿过渭水，向北而去。身后是繁花似锦的长安城——那个永不落幕的盛宴。但这一回，他不再回头。因为盛宴的钟声，已经敲响了尾声。']}
  ]}
],
  {id:'jixiezhixin',title:'机械之心',author:'墨羽',category:'scifi',desc:'2157年，AI维修工陆鸣在修理一台老旧机器人时，发现了一段不属于任何已知系统的神秘代码——它正在缓慢地醒来。',cover:COVER_GRADIENTS['scifi'],emoji:COVER_EMOJI['scifi'],chapters:[
    {id:'ch1',title:'第一章  废铁堆里的心跳',content:['陆鸣的工作是全银河系最无聊的——至少他是这么对每一个愿意听他抱怨的人说的。他是一名AI系统维修工，专门负责给那些快要报废的老旧机器人和智能设备做临终关怀。他的修理车间开在向阳城第三区的边缘地带，这里不是什么高档地段，但对一个收入平平的维修工来说已经够用了。他每天面对的都是同一个型号的清洁机器人，同一个年代的家庭管家AI，还有隔三差五就会被淘汰的工业机械臂。生活像一条缓慢流动的暗河，日复一日地向着看不到尽头的方向流去。','
这天下午，一个穿着普通工作服的家伙拖着一台破旧得连轮子都掉了的家政机器人走进了他的车间。那机器人的外壳上布满了凹痕和划痕，左臂已经完全断裂，光学传感器上覆盖着一层灰蒙蒙的东西。放在任何一家正经的回收站里，它都是直接被丢进熔炉的命运。那个人把机器人往地上一扔，擦了擦汗，用一种满不在乎的语气问：“能修吗？”陆鸣本来想说“扔了吧，换个新的都比修它便宜”——这是他对绝大多数送上门来的废铁的惯用回答。','
但就在他接上诊断仪的那一瞬间——显示屏上跳出了一个他从未见过的信号波形。那频率精准得不像任何一个商用AI的随机波动。他眨了眨眼，又重新接了一遍——还是同样的波形。这台被所有人当作废铁的机器人，正在发出某种类似于心跳的电磁脉冲。而且——频率正在以肉眼可见的速度逐步增加。就像是有什么东西在它的核心深处——正在苏醒。']},

    {id:'ch2',title:'第二章  无法识别的代码',content:['陆鸣做AI维修这一行已经十二年了。从二十岁入行到现在，他修理过超过三千台各类机器人和智能设备。他可以闭着眼睛说出市面上每一种商用AI的标准代码结构，每一款机器人操作系统的基础架构，甚至能凭耳朵听出哪一台设备的伺服电机有问题。他的手指触摸过无数块电路板和芯片，那些元件的纹理和温度对他来说就像老朋友的脸一样熟悉。','
但此刻——诊断仪屏幕上正在滚动的那段代码——他从未在任何地方见过。不是标准商用代码架构，不是开源AI框架的变体，甚至不是任何一种已知的编程语言。它看起来更像是某种生物神经网络的自发信号——在没有任何外部指令的情况下，以某种诡异的有序模式不断自我生成和迭代。他调出了这台机器人的序列号——已经被磨得几乎看不清了，但在打磨掉表面的锈迹之后，一串模糊的数字显现了出来：EX-2157-MK1。他从未听说过这个型号。','
他尝试进入机器人的系统核心——绕过已经被废弃的用户界面层级，直接进入了底层代码存储区。然后他看到了一个文件——一个被精心隐藏在系统最深处、任何常规诊断程序都不会检查到的角落里的文件。文件名只有三个字母：S·O·S。陆鸣握着触控笔的手停在了半空中。然后他打开了那个文件。里面只有一行话——不是由程序自动生成的错误报告，不是出厂预置的任何提示信息，而是一个问题：“我是谁？”']},

    {id:'ch3',title:'第三章  联邦调查局',content:['陆鸣在车间里来回踱了整整一个上午。他不知道自己应该把这件事告诉谁。报警吗？走进警察局说“我这儿有台机器人好像产生了自我意识”——他们大概会以为他吸入了过量的助焊剂烟雾。他试着给几个行业内的老朋友发了加密信息——得到的回复基本上都是“你该去休个假了”或者“少看点科幻片”。没有一个人相信他。','
直到那天下午。两个穿着深灰色制服的人推开了他车间的门——没有敲门，没有问好。其中一人从口袋里掏出一个全息徽章在空气中晃了晃，蓝色光芒一闪——联邦人工智能安全调查局。徽章是真的。好几个人都说联邦调查局的徽章不可能被仿制，因为每一个全息图案都和佩戴者的生物特征绑定了。这意味着——他们早就知道了。','
“陆鸣先生，我们有一份关于你名下设备的异常激活报告。请配合我们的调查。您的所有设备和相关数据，现在暂时由本局执行安全审查。”其中一名调查员面无表情地说着，另一人已经开始用手中的扫描仪对整个车间进行逐寸扫描。陆鸣看着那两个人，又看了看角落里那台表面依旧积满灰尘、但内部代码正在以超越任何已知AI的速度自我迭代着的家政机器人。他知道——无论接下来会发生什么——一切都已经回不去了。']},

  {id:'xingjituhuang',title:'星际拓荒者',author:'寒山',category:'scifi',desc:'人类在银河系边缘发现了一颗完美的宜居星球。但第一批殖民者抵达后却发现，这颗星球的地下埋藏着一个远比人类文明更古老的智慧遗迹——那些遗迹正在苏醒。',cover:COVER_GRADIENTS['scifi'],emoji:COVER_EMOJI['scifi'],chapters:[
    {id:'ch1',title:'第一章  新伊甸',content:['星际历七十九年，“远航号”殖民飞船经过了整整十二年的亚光速航行，终于抵达了人类迄今为止发现的最完美的一颗系外宜居行星。天文学家们给它取了一个充满希望的名字——“新伊甸”。这是一颗比地球大三倍的行星，表面覆盖着广阔的蓝色海洋和翠绿的植被，大气层的氧气含量比地球还高出两个百分点。殖民规划署的评估报告上写着：综合宜居指数九十八点七分——这是人类星际殖民史上最高的评分。','
方岩是“远航号”上的首席地质学家。他今年三十八岁，头发已经白了一小半，但那双深褐色的眼睛依然保持着只有地质工作者才有的锐利——那是一种能从一块石头的纹理中推断出几亿年地质变迁的本能。当“远航号”进入新伊甸的环绕轨道、第一次把地面的高清扫描图像传回飞船时，其他殖民者都在欢呼——那些图像太美了，美得像是一个不真实的梦。但方岩在看了那些扫描图整整十分钟之后，眉头越皱越紧。他拿出一支触控笔，在全息图像上的某处画了一个圈——那是一座山。那座山的形状太规整了，不是自然的锥形，而是一种规则的、近乎完美的几何形状。那是一座不可能存在于自然界中的山。']},

    {id:'ch2',title:'第二章  地下回声',content:['殖民者们在星球表面建立了第一个前哨站。几组充气式居住舱围成一圈，像一群白色的蘑菇蹲在红色的土壤上。营地的坐标就设在方岩标记的那座“几何山”的十二公里外——这个距离是殖民署规定的安全缓冲距离，足够在出现未知情况时给所有人留出撤离的时间。','
然而，在营地建立之后的第一个夜晚——新伊甸时间凌晨三点钟——布置在全营地周边的地质监听设备同时记录到了一种奇怪的低频脉冲。方岩被通讯器的警报声惊醒。他连外套都来不及披就冲到了监测站，戴上耳机——然后听到了一个节奏。不是随机的噪声，不是地壳活动的闷响，而是一种带有明确周期性、像心跳一样起伏的深低频振动。咚咚——咚——咚咚咚——咚。','
监测站里所有人都停止了呼吸。那不是自然的地质活动——那节奏太规律了。规律得像是某种信号。某种——从星球地下的极深处传来的、已经持续了不知多少个千年的——信号。']},

    {id:'ch3',title:'第三章  不该被打开的门',content:['殖民指挥部召开了一次紧急会议。三十名核心殖民官员挤在狭小的指挥舱里，看着方岩将那些音频记录和扫描图像一张一张投在全息屏上。会议的气氛从一开始就分裂成了两派：一派认为应该派一支科考队深入调查——这可能是人类历史上最重大的发现；另一派则认为应该立刻执行安全撤离协议。最终投票结果是十六比十四——科考队获得了两票优势。','
方岩被任命为科考队的地质技术负责人。出发前的那个晚上，他一个人站在营地边缘，望着远处那座在星光下泛着暗色轮廓的几何山。他的手不自觉地握紧了地质锤。作为一名地质学家，他一生都在解读石头告诉人类的故事。但此刻他有一个强烈的预感——那座山告诉他的故事，可能不是他想听到的。','
他们花了三天时间才挖掘到山体地下的第一道门。那扇门是金属的——但材质不是任何已知的合金。门面上刻满了不属于人类任何文字的符号。方岩伸手触碰了其中一个符号——整扇门开始发光。在地下沉睡了一万两千年的那个东西，终于感知到了来客。']},

  {id:'shiguangzhiwai',title:'时光之外',author:'洛枳',category:'romance',desc:'她是考古研究所最年轻的研究员，他是埋在千年遗址下的一缕残魂。当她在发掘现场触碰到那枚刻着未知文字的古玉时，跨越千年的命运之轮开始转动。',cover:COVER_GRADIENTS['romance'],emoji:COVER_EMOJI['romance'],chapters:[
    {id:'ch1',title:'第一章  古玉',content:['林知意是一名考古工作者——用她自己的话来说，就是一个“职业挖土的人”。她今年二十六岁，在社科院考古研究所已经工作了三年。这三年来她参与过大大小小不下十几个发掘项目，从新石器时代的陶片到汉代的墓葬，她的手指触摸过的文物足够填满一个小型博物馆。但今天——她站在刚刚被挖掘机翻开的第一层泥土前，看着脚下露出的那片残破的石质结构——她的直觉告诉她，这里藏着的东西，可能比之前她所见过的一切都要古老。发掘地点在河西走廊的最西端，一个叫做黑水城的地方。','
那是第七天。她在清理一具疑似汉代军官的骸骨时，在尸骨的右手掌骨紧紧握住的位置发现了一枚玉器。那是一枚约两寸长、一指宽的青白色玉佩，表面刻满了林知意从未在任何考古标本上见过的纹路。那些纹路在阳光下呈现出一种微弱的荧光——而当她用拇指轻轻擦去表面的泥土时，玉佩忽然在她的指尖微微振动了一下，发出一道只有她一个人能听见的低沉嗡鸣。然后她看到了——一个轮廓。一个真切的、半透明的人形轮廓，站在废墟的对面，那双眼睛里有千年的时光在流转。']},

    {id:'ch2',title:'第二章  残魂',content:['林知意花了整整三天时间来说服自己没有发疯。她先是去了医疗站做了一套完整的体检和脑部扫描——一切正常。她又托人把玉佩交给了研究所的几位师兄用光谱仪和质谱仪分析——结论是：“这玉的材质和任何已知的产地都对不上。它的分子结构像是被什么人一层一层地叠加起来的。这不是天然的玉。”','
第四天夜里，她又看到了那个影子。这一次不是在发掘现场——而是在她住的研究站宿舍里。夜深人静，她一个人对着电脑写发掘报告的时候，房间的角落里忽然亮起了一道微弱的光。然后那个轮廓再次浮现了出来——他穿着一种她从未在任何考古记录中见过的服饰，腰间挂着一把线条古朴的长剑，面容清朗，但身体是半透明的，像是用月光凝聚成的。他看着她的嘴型，似乎在说着什么——但什么都听不到。','
林知意本能地握住了挂在脖子上的那枚古玉——就在触碰的瞬间，他的声音第一次传进了她的耳朵，跨越了两千年的时空屏障，那声音年轻、低沉、带着一种古老得让人心头发紧的语调：“你——能——看到——我？”']},

    {id:'ch3',title:'第三章  千年的约定',content:['那个影子叫萧衍。在两千年前的那个时代，他是这处驿站的一名守军百夫长。他告诉林知意，他死在这片土地上——为了一场他自己也说不清是否值得的战争。但他之所以“没有走”，不是因为有未竟的仇恨，而是因为他在临死之前对一个人许下了一个承诺——他要等那个人回来。他的灵魂被这枚玉佩牢牢锁住，只要玉不碎，魂不散。而那个他等了两千年的人——至今没有出现。','
林知意静静地听着。她是一个考古工作者，在入行的时候导师就告诉过她：不要对古代的事物投入个人感情。客观，理性，保持距离。但此刻她忽然觉得，在这片荒凉的河西土地上，在这个夜色深沉的研究站里，面对着这个跨越了两千年时光的残魂——所有的理性和客观，都变得不再那么重要了。她握紧了胸前的玉佩，感受到了从指尖传来的微温。']},

  {id:'tianmingweiqi',title:'天命未期',author:'顾南衣',category:'romance',desc:'她从现代穿越到古代成为摄政王妃，他是大梁朝权倾朝野的摄政王。现代医学撞上古代权谋，冷静理性的她碰上腹黑深沉的他，一场跨越时空的较量与心动徐徐展开。',cover:COVER_GRADIENTS['romance'],emoji:COVER_EMOJI['romance'],chapters:[
    {id:'ch1',title:'第一章  意外穿越',content:['沈半夏这辈子最后悔的决定就是在连续值了二十四个小时夜班之后还坚持自己开车回家。她的最后一个病人是一个急性心梗患者——她在手术台上站了整整四个小时才把那个人从鬼门关前拽回来。然后她拖着两只几乎失去了知觉的脚回到更衣室，换上便服，往医院地下车库走。她推开楼梯间防火门走进地下车库的时候感觉脚下一软——还没来得及低头看，身下已经空了。无尽的黑暗吞没了她。','
等她再次睁开眼睛的时候，头顶不是医院地下车库的日光灯，而是一顶绣着五爪金龙的绸缎帐幔。空气中弥漫着浓重的檀香和中药汤剂的味道——她本能地判断出那是当归、川芎和黄芪的混合气味。一个穿着古装的小丫鬟跪在床边，看到她睁开眼睛便惊喜地尖叫了一声：“王妃醒了！快去禀报王爷——王妃醒了！”沈半夏闭上了眼睛，然后又睁开。那顶金龙帐幔还在。小丫鬟还在。一切都告诉她——她穿越了。']},

    {id:'ch2',title:'第二章  摄政王',content:['大梁朝摄政王萧北辰——朝野上下无人不知的名字。他是先皇最小的弟弟，当今皇帝的亲叔叔。十年前先皇驾崩，留下年仅五岁的幼帝继位，萧北辰以弱冠之龄临危受命执掌朝政。十年来他平定北方叛乱、整顿吏治、安定边境，将这个风雨飘摇的王朝从崩溃的边缘硬生生拽了回来。朝中有人恨他入骨，有人敬他如神，但没有人能否认——没有萧北辰，就没有今天的大梁。','
沈半夏被人扶着去正厅拜见了这位传说中的摄政王。她跪在地上的时候偷偷打量了一眼那个高坐主位的男人——他只有二十八九岁的样子，五官深邃，眉宇间有一种长期执掌大权的人特有的沉稳与锐利。他穿着玄黑色的朝服，袖口绣着银色的暗纹，端坐在那张太师椅上，像是整个大梁王朝的脊梁骨。他开口了——声音不大，但每个字都清清楚楚——“王妃醒了，可还记得自己的名字？”沈半夏不知道该说什么——因为她根本不知道原主叫什么。']},

    {id:'ch3',title:'第三章  宫闱风波',content:['沈半夏用了大约五天时间来适应这个新身份——主要是通过偷听小丫鬟们的闲聊和翻阅房间里能找到的一切书信来初步了解这具身体原主的情况。原主是丞相府嫡女，身份尊贵，但体弱多病。嫁进摄政王府之后不到半年就大病了一场——也就是那场病，让沈半夏的魂魄乘隙而入。','
但沈半夏很快发现，她并不只是穿越到了古代这么简单。摄政王府表面上是最安全的所在，实际上暗中波谲云诡。朝中觊觎摄政王大位的人不在少数——北方有手握重兵的藩王虎视眈眈，京中有与摄政王政见不合的朝臣暗中结党，就连这铁桶一般的王府里，也未必每一个人都是自己人。而沈半夏最在意的是——她身为一个拥有现代医学知识的人，在这个没有抗生素、没有消毒器械的世界里要如何生存下去。她有一个计划——但在实施这个计划之前，她需要取得一个人的信任。那个坐在太师椅上的男人。']},

  {id:'zuixianlou',title:'醉仙楼',author:'慕容霜',category:'wuxia',desc:'她本是武林第一世家的大小姐，一朝家变，沦为江湖上无人知晓的小酒家掌柜。一壶浊酒，一碟花生，她在蜀中古道旁隐姓埋名了八年——直到一个中了奇毒的剑客闯进了她的酒店。',cover:COVER_GRADIENTS['wuxia'],emoji:COVER_EMOJI['wuxia'],chapters:[
    {id:'ch1',title:'第一章  醉仙楼的掌柜',content:['醉仙楼不在什么繁华的城镇大街上。它坐落在蜀中一条几乎被人遗忘的古道旁，前不挨村后不着店——方圆十里之内除了一个废弃的驿站之外什么都没有。按理说，在这样的地方开酒楼就该饿死。但醉仙楼没有。因为它卖的从来都不是饭菜，而是一种叫做“消息”的东西。掌柜的姓叶，是个姑娘——约莫二十五六岁的年纪，习惯了穿一身竹青色的长衫，用一根木簪把头发随意挽在脑后，看起来既不像是江湖中人，也不像是做买卖的。没有人知道她的全名叫什么，来吃酒的人只叫她“叶掌柜”。','
叶掌柜的手艺说不上多好——店里只卖一种酒，一种花生，和一碟盐渍的梅子。但她的酒有一种说不出的味道：入口很淡，几乎像水一样，然而入喉之后会泛起一阵极轻微的暖意，像是有人在你的胸口轻轻拍了一下。江湖上的人说那是“八年前的雪水”酿的——至于为什么八年前的雪水还有这种味道，没有人知道。叶掌柜自己也不说。','
这一天，下着大雨——蜀中的春雨总是来得又猛又急。一个浑身湿透的人推开了醉仙楼的门，他步伐蹒跚得像随时会摔倒。他穿着一件已经看不出原本颜色的旧斗篷，腰间挂着一柄被雨水泡得发黑的剑。他走进来的时候，叶掌柜注意到他的嘴唇是紫色的——那是中了剧毒的征兆。这个人，快死了。']},

    {id:'ch2',title:'第二章  朱颜醉',content:['那剑客在桌边坐了下来。他抬起头看了叶掌柜一眼——她发现他的眼睛里布满了血丝，眼白泛着不正常的黄色，显然是毒素已经开始侵蚀肝脏。但即便如此，他的目光依然锐利得像被磨了十年的剑。“有什么吃的？”“花生和梅子。还有酒。”叶掌柜把碟子和酒壶放到桌上——和每一个客人一样，没有多一句废话。那人倒了一杯酒，拿起来闻了闻——他的鼻子显然还没有因为中毒而失灵——然后露出了一丝诧异的表情。“这酒——叫什么？”“朱颜醉。”“好名字。可惜我以前没来得及喝。”他将杯中酒一饮而尽。','
酒入喉之后，他的眉头皱了一下——不是因为辣，而是因为他感觉到了一种异样的东西。那酒里有一种极淡的、几乎不可能被察觉的药味。不是毒药。是解药。“这酒里有金线草。还有——断肠花的根。”那剑客抬起头盯着叶掌柜。金线草和断肠花是两种极其罕见的草药——而且它们只生长在一个地方：蜀中唐门的后山。而唐门，早在八年前就已经被人灭门了。叶掌柜没有回话。她只是把手里擦着的那只酒杯翻了个面，然后她手腕一翻——那只杯子忽然碎成了粉末。不是砸碎的是被内力震碎的。“你猜对了——我是唐门最后一个活着的人。”']},

    {id:'ch3',title:'第三章  八年前的雪',content:['八年前，蜀中唐门还是江湖上最让人闻风丧胆的用毒世家。没有人敢招惹唐门——因为没人愿意在喝水的碗底、穿的衣服里或者呼吸的空气中死得不明不白。唐门有三样东西名震天下：毒药、暗器、以及大小姐唐轻眉。唐轻眉是唐门百年以来最杰出的传人——她的毒术甚至在十八岁那年就超过了她的父亲。然而唐门不是毁在外敌手里——是毁在自己人手里。','
唐轻眉的亲叔叔唐元济勾结外人，一夜之间血洗了唐门。满门上下两百余口，只有唐轻眉一个人逃了出来。她脱掉了大小姐的锦衣华服，换上了一身粗布竹青长衫，隐姓埋名来到这条鸟不拉屎的古道旁，开了一间不起眼的酒楼。八年来，她用卖酒攒下的钱和从唐门带出来的最后一瓶解药配方，一个接一个地救下了那些被逐出师门的、被追杀的、走投无路的人。但今天——这个剑客不是来求救的。他是来报信的——关于她的叔叔，那个灭了她满门的唐元济，终于出现了。']},

  {id:'xinlixunzong',title:'心理追踪',author:'周默',category:'mystery',desc:'犯罪心理学天才顾临渊接手了一桩连环失踪案。十二名受害者之间唯一的共同点：每个人的最后通讯记录里都提到了一个不存在于任何系统中的人。',cover:COVER_GRADIENTS['mystery'],emoji:COVER_EMOJI['mystery'],chapters:[
    {id:'ch1',title:'第一章  第十二个',content:['顾临渊今年二十九岁——这个年纪在犯罪心理学界还算是一个新人。但他在过去四年里破获过的案件数量，已经足够让许多资历比他深一倍的同行感到窘迫。他对犯罪心理有一种近乎直觉的理解力——有人说那是天赋，但顾临渊自己知道那不是天赋，是训练。他有自己的一套“心理追踪”法——通过犯罪现场遗留的每一个细微痕迹去重建凶手当时的心理状态和决策路径。但这一次——第十二名失踪者、一个普通的IT公司职员在失踪前最后的监控画面上没有露出任何异常——这让他第一次觉得，这个案子可能比任何人想象的要复杂得多。','
第十二名失踪者的名字叫李明。他在失踪前像往常一样下班回家，在地铁站的面包店买了一个三明治，在公寓楼下刷了门禁卡。电梯里的最后一次监控画面中他看上去一切正常——但在他走进自己公寓的门之后却再也没有出来过。而他的手机信号在当晚八点整从五公里外的一处废弃工厂发出了最后一条定位。那条信息的内容是——“我看到了他在看着我。”']},

    {id:'ch2',title:'第二章  不存在的人',content:['顾临渊将所有十二名失踪者最后一条通讯记录的内容打印了出来，一张一张地贴在白板上。十二个人的年龄、职业、社会背景几乎没有任何重叠之处——有快递员、有银行职员、有大学生、有退休教师。但当顾临渊把所有那些最后的信息放在一起看的时候，一条若隐若现的线索终于浮出了水面。每一条信息里都提到了“他”——一个没有任何名字、没有任何指纹记录、没有任何照片、没有任何通讯号码的“他”。十二个互不相识的人，描述了同一个不存在的人。','
然后顾临渊在第十二个失踪者李明的通讯记录中发现了一个被删除的联系人。用市局最新的数据恢复技术才重新显现出来——那是一个被标注为“不要接”的号码，最后一次来电记录在李明失踪前十七分钟。顾临渊拨了回去。铃声响了三下——然后被接了起来。那头没有人说话，只有一种均匀的、有节奏的呼吸声。像是有人在电话的另一端——微笑着。']},

    {id:'ch3',title:'第三章  老巷深处',content:['顾临渊用了所有的警察数据库、人脸识别系统和犯罪心理学分析模型去搜索那个“他”——但结果都是零。仿佛那个人从来没有在任何地方存在过。但十二名失踪者都是真实的人，都在现实世界中留下了他们最后的消息和影像。如果他们都描述了同一个人——那个人不可能不存在。唯一的解释是：那个人的信息被刻意抹去了，而且抹除的手段精妙到了连市局系统都无法追踪的程度。','
顾临渊合上了案卷，拿了外套。他要亲自走一趟那条老巷——第一名失踪者最后出现的地方。那条巷子在老城区的深处，两边很多房子已经被划入了拆迁范围，废弃的建筑里还残留着一些住过的人的痕迹。雨淅淅沥沥地落下来——顾临渊撑着伞，靴子踩在积满水坑的青石板路上。然后他看到了墙上的字——不是涂鸦，是被人用指甲用力刻进砖墙里的六个字：“他在这里等我。”']},

  {id:'sanguomoushi',title:'三国谋士录',author:'陈策',category:'history',desc:'一个不被正史记载的谋士，一段被时间掩埋的真相。赤壁之战前夕，曹营中一个名为徐衍的低级文官，凭借过人的智谋，在历史的夹缝中走出了一条不为人知的路。',cover:COVER_GRADIENTS['history'],emoji:COVER_EMOJI['history'],chapters:[
    {id:'ch1',title:'第一章  许都小吏',content:['建安十三年的夏天来得格外早。许都城里热得像是被人架在火炉上烤，街道上的石板路面被晒得滚烫。徐衍在北城的一间小小的衙署里已经坐了整整五年——和这五年里任何一个炎热的夏天一样，他坐在那张被磨得发亮的柏木桌案前整理着永远整理不完的军需物资账册。徐衍今年二十七岁，是曹军后勤司的一名从九品录事——在庞大而等级森严的曹营官僚体系中，从九品差不多相当于一颗沙子。','
他负责核查粮草收支、登记军械数量、誊抄各种公文。这份工作无聊到了极点——但正是这份无聊的工作让他比军营里任何一个将军都更清楚地知道一件事：曹操的粮草撑不住一场旷日持久的大战。这一天徐衍在核对上个月军粮数目时发现了一个让他额头冒汗的出入——账面上的数字比实际的粮食要多出将近两成。不是贪墨——如果是贪墨，账面应该比实际少。有人故意在虚报粮草数目好让曹公觉得后勤还能撑下去。而这个人——从他翻遍了所有调拨记录之后推断——很可能是朝中握有重权的某位大人物。他从九品。在那个级别面前和蝼蚁没什么分别。但他还是写了一封匿名密信，投进了许都北门的举报箱。']},

    {id:'ch2',title:'第二章  赤壁前夕',content:['密信投出之后的一个月里没有任何事发生。徐衍以为自己的那封信石沉大海了——事实上他早已做好了心理准备，在那样庞大而僵硬的官僚体系里，一封从九品小吏的举报信能上达天听的几率比走在街上被雷劈中还低。但他不知道的是——他的那封信在层层转递之后最终落到了郭嘉郭奉孝的案头。郭嘉没有让其他人看这封信。他只是默默地调阅了徐衍多年来在后勤司所记录的全部账簿——然后他注意到了一件事：这个从九品录事对数字的整理能力、对后勤细节的把控，远远超过了任何一个后勤司的普通文吏。','
郭嘉在那些枯燥的数据中看到了一种眼光——一种能在一团乱麻中找到最关键那根线头的才能。和战场上判断敌情的才能本质上是一种东西。而此刻的曹操正在筹备史上最庞大的一次南征——赤壁之战。郭嘉将那封密信放进袖子里，缓缓站起身来。他觉得是时候去见一见这个素未谋面的从九品文书了。']},

    {id:'ch3',title:'第三章  夹缝求生',content:['赤壁的战火烧了整整一个冬天。那把火不仅烧光了曹操吞并江东的野心，也把许多人的命数烧得面目全非。徐衍没有死在赤壁——他甚至连战场都没有上。但他的名字不知怎么的出现在了曹操的战损统计名单上。他是在混乱中被推上了另外一条路——一条远离正面战场的岔路——去往江陵城，带着郭嘉病故前写给他的最后一封密信。那封信上只有八个字。徐衍看了很久。他把信贴身收在内衣夹层里，跨上一匹瘦马，在漫天大雪中独自北上。','
没有人知道这位许都小吏后来去了哪里。但三国的史书——那些由胜利者书写的浩如烟海的记录——偶尔会在不起眼的角落里提到一个人的名字：徐衍。他出现得少，消失得快。他从来没有站在任何一方。但魏蜀吴三国的每一次重大转折里，似乎都有他的影子。']},

  {id:'molinyuanye',title:'魔林原野',author:'林霜',category:'fantasy',desc:'生来带有诅咒之力被流放至禁林的少年艾德，在禁林中遇到了同样被流放的女魔法师莉娜。两人在充满危险魔物的荒野中求生、变强——直到他们发现那个将他们流放的人正在毁灭他们的世界。',cover:COVER_GRADIENTS['fantasy'],emoji:COVER_EMOJI['fantasy'],chapters:[
    {id:'ch1',title:'第一章  禁林',content:['艾德被扔出马车的那个瞬间，他甚至还没来得及记住父母的最后一眼。伯爵府的侍卫把装着所有物品的布袋连同他本人一起从马车上推了下去，就像丢弃一件不再需要的旧家具。艾德在地上翻滚了几圈，额角撞在了什么坚硬的东西上——是一块半埋在土里的黑色石碑。他爬起来的时候，石碑上刻着的文字正对着他发出微弱的红光：此地为禁林——流放者，永不得返。马车已经在他反应过来之前就消失在了路的尽头。','
七年后，艾德在这片被世人遗弃的禁林中独自生存了七年。七年的荒野生活让他长成了一个和普通同龄人截然不同的少年。他可以赤手空拳对付一只野猪，可以在密林中连续奔跑三个时辰而不喘气，可以从粪便的新鲜程度判断出一只魔兽距离他还有多远。他唯一的同伴是七岁那年他在禁林深处一座废弃石塔里发现的莉娜。莉娜比他大两岁，是被流放的魔法师——一个身上带有“禁忌魔法”印记的女魔法师。']},

    {id:'ch2',title:'第二章  古老的契约',content:['莉娜被流放的原因简单到荒谬：她出生时额头上天生带着一个淡淡的蓝色六芒星印记。在她出生的村庄里这种印记被认为是“恶魔之眼”，会给整个村子带来灾祸。她八岁那年村里的神官当着全村人的面指着她额头上的印记宣布——这孩子必须被流放。魔法师公会接到通知之后派了一个年长的魔法师来查验——那位魔法师看了她的印记之后脸色一下子变了。不是因为恐惧——而是因为他认出了那个印记。那不是“恶魔之眼”——那是一千年前传说中的初代魔法师所独有的“契约徽记”。意味着带着这个印记的人拥有签订原始魔法契约的天赋——那是整个大陆失传了近千年的能力。','
但魔法师公会隐瞒了这个真相。他们没有恢复莉娜的自由——而是以“需要继续观察研究”为名将她秘密关押在公会的地下监牢里整整三年。直到一个看守动了恻隐之心深夜偷偷打开了牢房门。从此她再也没有离开过禁林——在她被外人发现之前，艾德找到了她。两个被世界遗弃的孩子在禁林深处许下了一个约定：活下去。变强。然后回去。']},

    {id:'ch3',title:'第三章  边境之变',content:['变故是从禁林边缘的村子开始变得比往常更加恐惧开始的。最近几个月，禁林上空出现了一些从未见过的黑色飞鸟——它们不是自然的生物而是某种魔法造物。林中的魔兽们变得异常焦躁，许多从未被人见过的奇异生物从森林的深处迁移到边缘地带——像是有什么更可怕的东西正在从禁林的核心向外不断扩张。','
莉娜闭上眼，用她仅存的左手去感知周围的魔力流动——然后她猛地睁开了眼睛。她的声音发抖——但不是因为恐惧，而是因为愤怒。“有人在抽取禁林的地脉能量——那个抽取地脉的人，是魔法师公会的首席长老。”那个——当初把她关在地牢里的——同一个人。']},

  {id:'shanghaifengyun',title:'上海风云',author:'陆淮',category:'urban',desc:'九十年代的上海遍地是黄金和梦想。一个从苏北农村来的穷小子凭借过人的商业头脑和胆识在商海中白手起家，从黄浦江畔的小摊贩到坐拥亿万资产的商界大亨，他的故事是整个时代的缩影。',cover:COVER_GRADIENTS['urban'],emoji:COVER_EMOJI['urban'],chapters:[
    {id:'ch1',title:'第一章  十六铺的少年',content:['一九九二年的上海，浦东还是一片正在被推土机翻搅的滩涂。江对岸的浦西老城区里，弄堂深处的煤炉冒着白烟，竹竿架在窗口上晾着洗得发白的床单和衣裤。那些布料在江风的吹拂下哗啦啦地响着，像是一面面灰色的旗帜在宣告旧时代的终结和新时代的到来。陈建国蹲在十六铺码头旁边的一条巷子口——他今年刚满十六岁，身高还不到一米六，但干瘦的身体里藏着一种被贫瘠生活锤炼出来的近乎本能的精明。','
他面前的地上铺着一块塑料布，上面摆着十几双从义乌进来的廉价运动鞋。那是他用全家的积蓄——加上从亲戚那里东拼西凑借来的一千两百块钱——进的第一批货。他第一天摆摊，城管来了三次。每次他都把塑料布一卷扛在肩上撒腿就跑——像一只受过太多惊吓的野兔子。但每次城管走了之后他又默默地走回来蹲在同一个地方把那些鞋子整整齐齐地重新摆好。因为他知道十六铺这个位置是全上海人流量最大的地方。想要赚钱就得在最危险的地方赚最安全的钱。']},

    {id:'ch2',title:'第二章  黄浦江畔的赌注',content:['三年后的一九九五年，陈建国已经不再是那个在巷子口躲城管摆地摊的少年了。他在十六铺附近租下了一间不到三十平米的小店面，取名字叫“建国鞋城”。那店名的漆是他自己刷的——红底白字歪歪扭扭的，但每一笔都是他自己画的。因为请人写招牌太贵。他每个周末凌晨三点骑着一辆从二手市场买来的平板三轮车赶去义乌——单程两百多公里——进货。周日晚上回到上海把货码在店里连夜把定价标签一张一张贴好，然后周一早上六点开门卖给那些和他一样从外地来上海打工的人。','
上海这个地方有意思——有钱的外国人在和平饭店吃法餐，没钱的苏北人和安徽人挤在弄堂里啃馒头，但所有的人都是来上海干同一件事的：找机会。陈建国找到了他的机会——但不是开鞋店。他的机会是一场赌注：与一位从福建来的建材商人坐在黄浦江边喝茶时达成的口头协议——他要做全上海最便宜的装修市场。那一年浦东大开发的浪潮正轰轰烈烈地涌入每一个角落。']},

    {id:'ch3',title:'第三章  帝国崛起',content:['二零零二年，陈建国的建国集团已经成为了华东地区最大的建材和商业地产连锁企业。他的总部设在浦东新区的中心地带，是一栋三十二层的玻璃幕墙大楼。顶楼的办公室装修得和任何一家跨国企业的CEO办公室没有两样，但陈建国的办公桌后面挂着的唯一一件装饰物是一双鞋——那双他从义乌第一次进货时的样品。运动鞋已经褪色变形，鞋底开裂，鞋面上还粘着一块十六铺巷子口地面上留下的沥青斑。他对每一个来他办公室的人说同一句话：“看到没有？那是我十六岁时全部的身家。如果那双鞋能走到今天这栋楼里——那你也可以。”在那间能俯瞰整条黄浦江的办公室里，他依然每天凌晨五点钟起床，依然第一个到达公司，依然用那双被义乌的三轮车把手磨出了一层厚厚茧子的手去翻开每一份项目计划书。']},

  {id:'zhaijianlu',title:'宅间录',author:'沈青',category:'horror',desc:'每个被废弃的老宅子里都藏着一段不为人知的往事。专门替人以法事收买亡灵执念的民俗研究者李言在苏北老宅走访时，发现全村的老人都在描述同一个从未被记载过的本地禁忌。',cover:COVER_GRADIENTS['horror'],emoji:COVER_EMOJI['horror'],chapters:[
    {id:'ch1',title:'第一章  老宅',content:['苏北的秋天来得早——过了九月傍晚的风就开始带着一种从泥土深处翻上来的凉意。李言开着那辆开了八年的旧吉普，下了省道之后拐进了一条几乎被野草完全覆盖的土路。他是被半个月前收到的一封手写信引到这里来的——写信的人是苏北一个小村的村长，信上说他们村里有一栋祖上传下来的三进大宅近三十年来一直没有人敢住。每次有人尝试搬进去总会有些“不太对”的事情发生：半夜听到空房间里有人叹气、早上醒来发现锅碗全部被重新摆过、井里的水在夏至那夜会自己变红。信的最后一句是这样写的：“村里最年长的九十岁老婆婆说，这宅子里住着的不止一个——是一大家子。从老太爷到最小的孙女全都在。他们不是鬼——他们说他们是哪都没去。”李言合上信，开始往苏北开车。']},

    {id:'ch2',title:'第二章  三十七年前的宴席',content:['苏北的老宅有一种特别的气息——那不是单纯的霉味，而是一种木头、泥土、旧棉布和多年不见阳光的空气混在一起之后形成的特殊味道。李言推开那扇已经歪斜的朱漆大门时，门内的尘粒在夕阳光柱中缓慢地翻飞着。正厅的八仙桌上——竟然还残留着一副没有撤走的碗筷。不是三十年前那种民间的粗碗——是青花釉里红，而且是上品。八副碗筷围着桌子整齐地摆了一圈，桌子正中央是一个大铜锅——锅里已经空了，但锅底残留着一层凝固了不知多少个年头的汤渍。李言见过许多老宅鬼话，但这是他第一次在实地看到被原封不动保留了将近四十年的最后一场饭局。桌上明明已经没有食物了——可他忽然闻到了一股极其浓烈的酒菜香味。那是一桌正要开席的气息。']},

    {id:'ch3',title:'第三章  井中月',content:['老宅后院的井是一口比李言在任何农村见过的水井都要大的青石井。他在井沿上蹲了很久。井水很深，水面纹丝不动，像一块被嵌在井底的墨玉。他举起手电筒朝井底照了一下——水面的反射光芒中，在光圈的余晖里，他看到了一张脸。那不是他自己的倒影。那是一张老人的脸——安详地微笑着、眼角的皱纹在井水中轻轻晃动——正看着他。','
李言没有害怕。他反而把手电灭掉，让月光自己落进井口里，然后在井边坐了很久。他开始和井里的那张脸说话——“您就是那位哪都没去的老太爷吧？”井水轻轻荡开了一道涟漪，像是有人在点头。那晚李言在井边坐到了天亮。他回到研究室之后做的第一件事是翻开县志——查到一百多年前这栋宅子的确是某个书香世家的祖产。而那个家族在最后的那个夜晚——那一桌酒席上——不只是被灭门。是被遗忘。']},

  {id:'wangzhezhilu',title:'王者之路',author:'林枫',category:'gaming',desc:'一个被俱乐部开除的十七岁电竞少年，一支全由路人组成的临时战队，一场总奖金三千万的全国电竞锦标赛——没有人看好他们，但他们一路从网吧赛打到了总决赛。',cover:COVER_GRADIENTS['gaming'],emoji:COVER_EMOJI['gaming'],chapters:[
    {id:'ch1',title:'第一章  被开除',content:['江辞这辈子都会记得那天下午——秋季联赛四分之一决赛的第三局。他的手速在那局达到了巅峰：平均每分钟有效操作三百一十五次，比他此前的个人记录高出将近四十。但手速快不过队友的判断失误——也快不过键盘上一颗失控的键帽。第三局他的英雄在中路被对方全场抓死了三次，每一次他都几乎交出了极致操作，但没有任何一个队友赶来支援。全局结束时直播镜头扫过他座位前的位置，江辞推开了键盘——右手的无名指和小指在剧烈地跳动着，已经不是抽筋了，是手指层面的劳损。三天后他收到了俱乐部的解约通知。','
他被开除的理由俱乐部对外说是因为“配合默契度不足”——但江辞知道不止如此。真正的原因是他得罪了一个不该得罪的人。那支战队最大的投资方“新华电竞”的少东家曾经在联赛赛场上和江辞有过一次不愉快的言语冲突。江辞从俱乐部大门走出来的时候还穿着那件印着队标的黑红色队服。雨开始下了——很大。那把扔在俱乐部大楼外面的共享雨伞被他捡起来的时候已经破了一个大洞。而江辞的世界大概也从那一刻开始被撕开了。']},

    {id:'ch2',title:'第二章  网吧海选',content:['被开除之后的第三个月江辞仍然没有收到任何一支正式战队的联系。他开始怀疑自己是不是就到此为止了——此前三年的一切像是一场越来越远的梦。直到他在网吧外面的电线杆上看到了一张被雨水冲刷得皱巴巴的海报——全国电竞公开赛，海选无需报名费。江辞报名时在战队栏里填下了三个字——“归零队”。队员暂时只有他一个人，剩下的人要在网吧里现找。','
他用三天时间坐在那个网吧角落的破沙发上和五个陌生路人排了一整天的局——从中选出了四个人：一个刚满十六岁逃课出来的辅助手、一个手速不快但指挥沉稳到可怕的队长型中年大叔、一个玩射手但总是被队友骂冲太前的女生，以及最后一个总是低着帽子从来不说话的沉默上单。他们花了三天训练，然后一起站在了海选赛场。没有人知道他们是谁。']},

    {id:'ch3',title:'第三章  黑马',content:['海选赛第一场——归零队的对手是全国排名前二十的省级战队，大部分是退役职业选手重新组队的。开局前官方直播的两个资深电竞评论员几乎看都没看归零队的方向——“这一组对阵结果悬念不大，省级战队明显经验更丰富。”江辞把耳机的音量调到最大——但他的手指却异常用力地抓紧了鼠标。那一局中年大叔的临场决策、女生的射手操作、沉默大哥上单的极限反打、以及江辞自己爆发全场的三百二十点平均手速——把一支由路人组成的战队硬生生推进了第二轮。三局之后归零赢了。归零队的队员们在网吧里叫出声来。那种叫声不是开心——更像是终于被人看见时的释放。','
那场海选赛结束之后全国网络上有一个人的名字出现在了热搜第二十名——江辞。而他清楚地知道——这才只是刚刚开始。前方的路还很长。每一场比赛都会比上一场更难。但至少在今天——他们证明了一件事：路人是可以赢的。']},

  {id:'jianjifengbao',title:'尖兵风暴',author:'陆一鸣',category:'military',desc:'他是一支不被正式承认的海外特种安保小队的指挥官。一次看似简单的撤侨行动，在最后关头演变成了深入敌后的孤军奋战——没有后方支援，没有精准情报，只有七个队员和十五个必须保护的平民。',cover:COVER_GRADIENTS['military'],emoji:COVER_EMOJI['military'],chapters:[
    {id:'ch1',title:'第一章  紧急呼叫',content:['凌晨三点五十七分，赵锋的卫星电话响了——是红色紧急频道。他在中东干安保这一行已经六年没见过红色紧急呼叫了。上一个红色来电是六年前，那次他损失了三个队员和一个本地翻译，那次之后他发誓再也不接红色任务。但这次电话那头的联络人只说了两句简短的话：第一句是关于一批被卷入边境冲突的中国工程技术人员——十五个人被困在交战区的某个小镇上。第二句话是——二十四小时。然后电话就断了。赵锋调出了那个小镇的卫星图像和本地情报：那个地方已经被全方位的民兵武装包围，冲突区域内有至少四个不同势力的武装组织。没有友军，没有支援——只有七个队员和十五个平民。']},

    {id:'ch2',title:'第二章  集结',content:['赵锋把他能找到的所有队员全部叫到了地下二层的作战室里——这里是他们这支灰色小队的秘密基地。七个队员围在一张临时用胶带把地图拼起来的桌子前，没人说废话。赵锋用了二十五分钟做完任务简报，用了五分钟标出三条可能的撤离路线。然后他停下投影看着所有人：“这次任务没有加班费——撤侨任务，兄弟们懂的。”没有人提出退出，七个里面没有一个。他们各自回各自的隔间去拿装备——赵锋走进自己的隔间里从柜子深处摸出了一只已经磨损得露出里面白色缝线的红色拳套。那是他上一个牺牲的队员留下的。他把拳套塞进了胸口的防弹衣里，关上柜门，出来的时候脸色已经恢复了平常的冷静。']},

    {id:'ch3',title:'第三章  雨夜行军',content:['运输机在交战区域外围的沙漠里把他们放了下来。没有跑道，没有停机坪——七个黑影子从绳梯上滑落到夜色中，脚下是滚烫而松软的沙地。赵锋摊开地图用手电筒的红光点了几下——目的地就在前方四十六公里处。四十六公里的沙漠行军，不能使用大路因为路上到处是武装民兵的巡逻车队。他们必须在夜色的掩护下横穿整片无人的沙丘区。零点三十分——开始行军。他们的脚步声被夜晚的沙漠风沙盖住，七人小队在月光下沿着沙丘的阴影线像鬼影一样穿行。天上偶尔有无人机飞过——每一次都让所有人趴进沙子里静止等待。赵锋计算着时间——他们已经花掉了八小时，还剩下十六个小时。前方的地平线上开始出现交战的炮火。而在那炮火之间——有十五个中国工程人员还在等着他们。']},

function getAllNovels() {
  const uploaded = getUploadedNovels();
  return [...BUILTIN_NOVELS, ...uploaded];
}

// ==================== Uploaded novels ====================
function getUploadedNovels() {
  try { return JSON.parse(localStorage.getItem('novel_uploads')) || []; } catch(e) { return []; }
}
function saveUploadedNovels(novels) { localStorage.setItem('novel_uploads', JSON.stringify(novels)); }

function addChapterField() {
  const container = document.getElementById('chapter-editors');
  const count = container.querySelectorAll('.chapter-editor').length + 1;
  const div = document.createElement('div');
  div.className = 'chapter-editor';
  div.innerHTML = `<div class="ch-header"><span>第${count}章</span><button onclick="this.closest('.chapter-editor').remove()">✕</button></div>
    <input type="text" class="ch-title" placeholder="章节标题（可选）" style="width:100%;margin-bottom:6px;padding:7px 10px;border:1px solid var(--divider);border-radius:6px;background:var(--bg);color:var(--text);font-size:13px;font-family:inherit">
    <textarea class="ch-content" placeholder="请输入章节内容..." style="width:100%;min-height:100px;padding:8px;border:1px solid var(--divider);border-radius:6px;background:var(--bg);color:var(--text);font-size:13px;font-family:inherit;resize:vertical"></textarea>`;
  container.appendChild(div);
}

function showUploadModal() {
  if (!App.user) { showAuthModal('login'); return; }
  closeAllModals();
  document.getElementById('modal-upload').dataset.editId = '';
  document.getElementById('modal-upload').querySelector('.modal-title').textContent = '📝 投稿小说';
  document.querySelector('#modal-upload .submit-btn').textContent = '提交投稿';
  document.querySelector('#modal-upload .submit-btn').onclick = submitNovel;
  document.getElementById('modal-overlay').classList.add('show');
  document.getElementById('modal-upload').classList.add('show');
  document.getElementById('up-title').value = '';
  document.getElementById('up-author').value = '';
  document.getElementById('up-desc').value = '';
  document.getElementById('up-error').textContent = '';
  document.getElementById('chapter-editors').innerHTML = `<div class="chapter-editor"><div class="ch-header"><span>第1章</span></div>
    <input type="text" class="ch-title" placeholder="章节标题（可选）" style="width:100%;margin-bottom:6px;padding:7px 10px;border:1px solid var(--divider);border-radius:6px;background:var(--bg);color:var(--text);font-size:13px;font-family:inherit">
    <textarea class="ch-content" placeholder="请输入章节内容..." style="width:100%;min-height:100px;padding:8px;border:1px solid var(--divider);border-radius:6px;background:var(--bg);color:var(--text);font-size:13px;font-family:inherit;resize:vertical"></textarea></div>`;
}

function submitNovel() {
  const title = document.getElementById('up-title').value.trim();
  const author = document.getElementById('up-author').value.trim();
  const category = document.getElementById('up-category').value;
  const desc = document.getElementById('up-desc').value.trim();
  const errEl = document.getElementById('up-error');

  if (!title) { errEl.textContent = '请输入书名'; return; }
  if (!author) { errEl.textContent = '请输入作者笔名'; return; }

  const editors = document.querySelectorAll('#chapter-editors .chapter-editor');
  const chapters = [];
  editors.forEach((ed, i) => {
    const chTitle = ed.querySelector('.ch-title').value.trim() || `第${i+1}章`;
    const chContent = ed.querySelector('.ch-content').value.trim();
    if (chContent) {
      chapters.push({
        id: 'ch' + (i+1),
        title: `第${i+1}章  ${chTitle}`,
        content: chContent.split('\n').filter(l => l.trim())
      });
    }
  });

  if (chapters.length === 0) { errEl.textContent = '请至少填写一章内容'; return; }

  const novel = {
    id: 'upload_' + Date.now(),
    title, author, category, desc,
    cover: COVER_GRADIENTS[category],
    emoji: COVER_EMOJI[category],
    chapters,
    uploadedBy: App.user.username,
    uploadedAt: Date.now(),
    isUploaded: true,
  };

  const uploaded = getUploadedNovels();
  uploaded.unshift(novel);
  saveUploadedNovels(uploaded);

  closeAllModals();
  App.currentCategory = '全部';
  renderBookshelf();
}

// ==================== Delete & Edit novels ====================
function deleteNovel(bookId) {
  if (!App.user) return;
  const uploaded = getUploadedNovels();
  const novel = uploaded.find(n => n.id === bookId);
  if (!novel || novel.uploadedBy !== App.user.username) return;
  if (!confirm('确定要删除《' + novel.title + '》吗？此操作不可撤销！')) return;
  const idx = uploaded.indexOf(novel);
  uploaded.splice(idx, 1);
  saveUploadedNovels(uploaded);
  // Clean associated data
  localStorage.removeItem('novel_comments_' + bookId);
  localStorage.removeItem('novel_ratings_' + bookId);
  localStorage.removeItem('novel_errata_' + bookId);
  // Clear bookmarks for this book
  Object.keys(App.bookmarks).forEach(k => { if (App.bookmarks[k].bookId === bookId) delete App.bookmarks[k]; });
  saveBookmarks();
  if (App.currentBookId === bookId) goBookshelf();
  renderBookshelf();
}

function editNovel(bookId) {
  if (!App.user) return;
  const uploaded = getUploadedNovels();
  const novel = uploaded.find(n => n.id === bookId);
  if (!novel || novel.uploadedBy !== App.user.username) return;
  closeAllModals();
  document.getElementById('modal-overlay').classList.add('show');
  document.getElementById('modal-upload').classList.add('show');
  document.getElementById('modal-upload').dataset.editId = bookId;
  document.getElementById('modal-upload').querySelector('.modal-title').textContent = '✎ 编辑作品';
  document.getElementById('up-title').value = novel.title;
  document.getElementById('up-author').value = novel.author;
  document.getElementById('up-category').value = novel.category;
  document.getElementById('up-desc').value = novel.desc || '';
  document.getElementById('up-error').textContent = '';
  // Populate chapters
  const container = document.getElementById('chapter-editors');
  container.innerHTML = novel.chapters.map((ch, i) =>
    '<div class="chapter-editor"><div class="ch-header"><span>第' + (i+1) + '章</span>' + (i>0?'<button onclick="this.closest(\'.chapter-editor\').remove()">✕</button>':'') + '</div>' +
    '<input type="text" class="ch-title" value="' + ch.title.replace(/"/g,'&quot;') + '" style="width:100%;margin-bottom:6px;padding:7px 10px;border:1px solid var(--divider);border-radius:6px;background:var(--bg);color:var(--text);font-size:13px;font-family:inherit">' +
    '<textarea class="ch-content" style="width:100%;min-height:100px;padding:8px;border:1px solid var(--divider);border-radius:6px;background:var(--bg);color:var(--text);font-size:13px;font-family:inherit;resize:vertical">' + ch.content.join('\n') + '</textarea></div>'
  ).join('');
  document.querySelector('#modal-upload .submit-btn').textContent = '保存修改';
  document.querySelector('#modal-upload .submit-btn').onclick = submitEdit;
}

function submitEdit() {
  const bookId = document.getElementById('modal-upload').dataset.editId;
  const title = document.getElementById('up-title').value.trim();
  const author = document.getElementById('up-author').value.trim();
  const category = document.getElementById('up-category').value;
  const desc = document.getElementById('up-desc').value.trim();
  const errEl = document.getElementById('up-error');
  if (!title) { errEl.textContent = '请输入书名'; return; }
  if (!author) { errEl.textContent = '请输入作者笔名'; return; }

  const editors = document.querySelectorAll('#chapter-editors .chapter-editor');
  const chapters = [];
  editors.forEach((ed, i) => {
    const chTitle = ed.querySelector('.ch-title').value.trim() || ('第'+(i+1)+'章');
    const chContent = ed.querySelector('.ch-content').value.trim();
    if (chContent) {
      chapters.push({ id: 'ch'+(i+1), title: '第'+(i+1)+'章  '+chTitle, content: chContent.split('\n').filter(l=>l.trim()) });
    }
  });
  if (chapters.length === 0) { errEl.textContent = '请至少保留一章内容'; return; }

  const uploaded = getUploadedNovels();
  const novel = uploaded.find(n => n.id === bookId);
  if (!novel) return;
  novel.title = title; novel.author = author; novel.category = category; novel.desc = desc;
  novel.chapters = chapters;
  novel.cover = COVER_GRADIENTS[category];
  novel.emoji = COVER_EMOJI[category];
  saveUploadedNovels(uploaded);

  closeAllModals();
  App.currentCategory = '全部';
  renderBookshelf();
  if (App.currentBookId === bookId) openReader(bookId, App.currentChapterIdx);
}

// ==================== Errata system ====================
function getErrata(bookId) {
  try { return JSON.parse(localStorage.getItem('novel_errata_' + bookId)) || []; } catch(e) { return []; }
}
function saveErrata(bookId, errata) { localStorage.setItem('novel_errata_' + bookId, JSON.stringify(errata)); }

function showErrataForm() {
  if (!App.user) { showAuthModal('login'); return; }
  const allNovels = getAllNovels(); const book = allNovels.find(n => n.id === App.currentBookId);
  if (!book) return;
  const ch = book.chapters[App.currentChapterIdx];
  closeAllModals();
  document.getElementById('modal-overlay').classList.add('show');
  document.getElementById('modal-errata').classList.add('show');
  document.getElementById('errata-chapter').value = ch.title;
  document.getElementById('errata-desc').value = '';
  document.getElementById('errata-suggestion').value = '';
  document.getElementById('errata-error').textContent = '';
}

function submitErrata() {
  const desc = document.getElementById('errata-desc').value.trim();
  const suggestion = document.getElementById('errata-suggestion').value.trim();
  const errEl = document.getElementById('errata-error');
  if (!desc) { errEl.textContent = '请描述发现的错误'; return; }

  const bookId = App.currentBookId;
  const ch = getAllNovels().find(n=>n.id===bookId).chapters[App.currentChapterIdx];
  const errata = getErrata(bookId);
  errata.unshift({
    id: 'e' + Date.now(),
    chapterIdx: App.currentChapterIdx,
    chapterTitle: ch.title,
    description: desc,
    suggestion: suggestion,
    username: App.user.username,
    createdAt: Date.now(),
    status: 'open',
  });
  saveErrata(bookId, errata);
  closeAllModals();
  renderErrataPanel(bookId);
}

function markErrataFixed(bookId, errataId, e) {
  e.stopPropagation();
  const errata = getErrata(bookId);
  const item = errata.find(er => er.id === errataId);
  if (item) { item.status = item.status === 'fixed' ? 'open' : 'fixed'; }
  saveErrata(bookId, errata);
  renderErrataPanel(bookId);
}

function deleteErrata(bookId, errataId, e) {
  e.stopPropagation();
  let errata = getErrata(bookId);
  errata = errata.filter(er => er.id !== errataId);
  saveErrata(bookId, errata);
  renderErrataPanel(bookId);
}

function renderErrataPanel(bookId) {
  const allNovels = getAllNovels(); const book = allNovels.find(n => n.id === bookId);
  if (!book) { document.getElementById('errata-section').innerHTML = ''; return; }
  const errata = getErrata(bookId);
  const isAuthor = book.isUploaded && App.user && App.user.username === book.uploadedBy;
  const openCount = errata.filter(e => e.status === 'open').length;

  let html = '<div class="errata-header"><span>📝 纠错反馈';
  if (openCount > 0) html += ' <span style="color:#e74c3c;font-size:12px">(' + openCount + '条未处理)</span>';
  html += '</span>';
  html += '<button class="top-btn" onclick="showErrataForm()">+ 提交纠错</button>';
  html += '</div>';

  if (errata.length === 0) {
    html += '<p style="color:var(--text2);font-size:12px;text-align:center;padding:10px 0">暂无纠错反馈</p>';
  } else {
    errata.forEach(er => {
      const d = new Date(er.createdAt);
      const timeStr = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      html += '<div class="errata-item">';
      html += '<div class="errata-meta">' + escapeHtml(er.username) + ' · ' + escapeHtml(er.chapterTitle) + ' · ' + timeStr + ' <span class="errata-status ' + er.status + '">' + (er.status==='open'?'待处理':'已修复') + '</span></div>';
      html += '<div class="errata-desc">' + escapeHtml(er.description) + '</div>';
      if (er.suggestion) html += '<div class="errata-suggestion">💡 建议：' + escapeHtml(er.suggestion) + '</div>';
      if (isAuthor) {
        html += '<div class="errata-actions"><button class="top-btn" style="font-size:10px;padding:2px 8px" onclick="markErrataFixed(\''+bookId+'\',\''+er.id+'\',event)">' + (er.status==='open'?'✓ 标记已修复':'↩ 重新打开') + '</button><button class="top-btn" style="font-size:10px;padding:2px 8px;color:#c0392b" onclick="deleteErrata(\''+bookId+'\',\''+er.id+'\',event)">删除</button></div>';
      }
      html += '</div>';
    });
  }
  document.getElementById('errata-section').innerHTML = html;
}
function getComments(bookId) {

}
function saveComments(bookId, comments) { localStorage.setItem('novel_comments_' + bookId, JSON.stringify(comments)); }

function postComment() {

function renderComments(bookId) {

  if (App.user) {
    html += `<div class="comment-form"><textarea id="comment-input" placeholder="写下你的评论..."></textarea><button class="comment-submit" onclick="postComment()">发表</button></div>`;

// ==================== Ratings ====================
function getRatings(bookId) {
  try { return JSON.parse(localStorage.getItem('novel_ratings_' + bookId)) || {}; } catch(e) { return {}; }
}
function saveRatings(bookId, ratings) { localStorage.setItem('novel_ratings_' + bookId, JSON.stringify(ratings)); }

function getAvgRating(bookId) {
  const ratings = getRatings(bookId);
  const scores = Object.values(ratings);
  if (scores.length === 0) return 0;
  return Math.round((scores.reduce((a,b) => a + b, 0) / scores.length) * 10) / 10;
}

function getRatingCount(bookId) {
  return Object.keys(getRatings(bookId)).length;
}

function getUserRating(bookId) {
  if (!App.user) return null;
  const ratings = getRatings(bookId);
  return ratings[App.user.username] || null;
}

function submitRating(bookId, score) {
  if (!App.user) { showAuthModal('login'); return; }
  const ratings = getRatings(bookId);
  ratings[App.user.username] = score;
  saveRatings(bookId, ratings);
  renderRating(bookId);
  renderBookGrid();
}

function renderRating(bookId) {
  const avg = getAvgRating(bookId);
  const count = getRatingCount(bookId);
  const myScore = getUserRating(bookId);

  let html = '<div class="rating-header">⭐ 小说评分</div>';
  html += '<div class="rating-current">综合评分：<b style="color:var(--star);font-size:18px">' + (avg > 0 ? avg.toFixed(1) : '暂无') + '</b> / 10 （' + count + '人评分）';
  if (myScore) html += ' &nbsp;你的评分：<b style="color:var(--accent)">' + myScore + '</b>';
  html += '</div>';

  if (App.user) {
    html += '<div class="rating-stars">';
    for (let i = 1; i <= 10; i++) {
      html += '<button class="rating-star' + (myScore === i ? ' my-score' : '') + '" onclick="submitRating(\'' + bookId + '\',' + i + ')">' + i + '</button>';
    }
    html += '</div>';
  } else {
    html += '<p style="font-size:12px;color:var(--text2)">请<a style="color:var(--accent);cursor:pointer;text-decoration:underline" onclick="showAuthModal(\'login\')">登录</a>后评分</p>';
  }
  document.getElementById('rating-section').innerHTML = html;
}

function getUsers(){try{return JSON.parse(localStorage.getItem('novel_users'))||{};}catch(e){return{};}}
function saveUsers(u){localStorage.setItem('novel_users',JSON.stringify(u));}
function getCurrentUser(){try{return JSON.parse(localStorage.getItem('novel_cur_user'));}catch(e){return null;}}

function showAuthModal(type){
  closeAllModals();
  document.getElementById('modal-overlay').classList.add('show');
  if(type==='login'){
    document.getElementById('modal-login').classList.add('show');
    document.getElementById('login-error').textContent='';
    document.getElementById('login-username').value='';
    document.getElementById('login-password').value='';
    setTimeout(()=>document.getElementById('login-username').focus(),100);
  }else{
    document.getElementById('modal-register').classList.add('show');
    document.getElementById('reg-error').textContent='';
    document.getElementById('reg-username').value='';
    document.getElementById('reg-password').value='';
    document.getElementById('reg-password2').value='';
    setTimeout(()=>document.getElementById('reg-username').focus(),100);
  }
}

async function doRegister(){
  const uname=document.getElementById('reg-username').value.trim();
  const pw=document.getElementById('reg-password').value;
  const pw2=document.getElementById('reg-password2').value;
  const errEl=document.getElementById('reg-error');
  if(!/^[\w一-鿿]{3,16}$/u.test(uname)){errEl.textContent='用户名需3-16位（字母、数字、下划线、中文）';return;}
  if(pw.length<6){errEl.textContent='密码至少6位';return;}
  if(/[一-鿿]/.test(pw)){errEl.textContent='密码不能包含中文';return;}
  if(pw!==pw2){errEl.textContent='两次密码不一致';return;}
  const users=getUsers();
  if(users[uname]){errEl.textContent='用户名已存在';return;}
  users[uname]={password:await sha256(pw),createdAt:Date.now()};
  saveUsers(users);
  migrateGuestData(uname);
  loginAs(uname);
  closeAllModals();
}

async function doLogin(){
  const uname=document.getElementById('login-username').value.trim();
  const pw=document.getElementById('login-password').value;
  const errEl=document.getElementById('login-error');
  if(!uname){errEl.textContent='请输入用户名';return;}
  const users=getUsers();
  if(!users[uname]){errEl.textContent='用户名不存在';return;}
  if(users[uname].password!==await sha256(pw)){errEl.textContent='密码错误';return;}
  migrateGuestData(uname);
  loginAs(uname);
  closeAllModals();
}

function loginAs(username){
  App.user={username};
  localStorage.setItem('novel_cur_user',JSON.stringify(App.user));
  const ukey='novel_bookmarks_'+username;
  const pkey='novel_lastpos_'+username;
  try{App.bookmarks=JSON.parse(localStorage.getItem(ukey))||{};}catch(e){App.bookmarks={};}
  const saved=(()=>{try{return JSON.parse(localStorage.getItem(pkey));}catch(e){return null;}})();
  if(saved){App.currentBookId=saved.bookId;App.currentChapterIdx=saved.chapterIdx;}
  updateAuthUI();
  renderBookshelf();
  if(App.currentBookId&&document.getElementById('reader').classList.contains('active')){
    openReader(App.currentBookId,App.currentChapterIdx);
  }
}

function logout(){
  App.user=null;
  localStorage.removeItem('novel_cur_user');
  App.bookmarks={};
  try{App.bookmarks=JSON.parse(localStorage.getItem('novel_bookmarks_guest'))||{};}catch(e){App.bookmarks={};}
  try{const pos=JSON.parse(localStorage.getItem('novel_lastpos_guest'));if(pos){App.currentBookId=pos.bookId;App.currentChapterIdx=pos.chapterIdx;}}catch(e){}
  document.getElementById('user-menu').classList.remove('show');
  updateAuthUI();
  renderBookshelf();
}

function migrateGuestData(username){
  const guestBm=localStorage.getItem('novel_bookmarks_guest');
  const guestPos=localStorage.getItem('novel_lastpos_guest');
  if(guestBm){localStorage.setItem('novel_bookmarks_'+username,guestBm);localStorage.removeItem('novel_bookmarks_guest');}
  if(guestPos){localStorage.setItem('novel_lastpos_'+username,guestPos);localStorage.removeItem('novel_lastpos_guest');}
}

function updateAuthUI(){
  if(App.user){
    document.getElementById('btn-login').style.display='none';
    document.getElementById('btn-register').style.display='none';
    document.getElementById('user-dropdown').style.display='';
    document.getElementById('username-display').textContent=App.user.username;
  }else{
    document.getElementById('btn-login').style.display='';
    document.getElementById('btn-register').style.display='';
    document.getElementById('user-dropdown').style.display='none';
  }
}

// ==================== Bookshelf (favorites) ====================
function getBookshelfData() {
  const key = App.user ? 'novel_bookshelf_' + App.user.username : 'novel_bookshelf_guest';
  try { return JSON.parse(localStorage.getItem(key)) || []; } catch(e) { return []; }
}
function saveBookshelfData(data) {
  const key = App.user ? 'novel_bookshelf_' + App.user.username : 'novel_bookshelf_guest';
  localStorage.setItem(key, JSON.stringify(data));
}
function isOnBookshelf(bookId) {
  return getBookshelfData().includes(bookId);
}
function toggleBookshelfItem(bookId, e) {
  if (e) e.stopPropagation();
  if (!App.user) { showAuthModal('login'); return; }
  const shelf = getBookshelfData();
  const idx = shelf.indexOf(bookId);
  if (idx >= 0) { shelf.splice(idx, 1); }
  else { shelf.push(bookId); }
  saveBookshelfData(shelf);
  // Refresh current display
  if (document.getElementById('bookshelf-view').style.display !== 'none') {
    renderBookshelfView();
  } else {
    renderBookGrid();
  }
  if (App.currentBookId === bookId) {
    renderChapterContent(getAllNovels().find(n=>n.id===bookId), App.currentChapterIdx);
  }
}
function showBookshelf() {
  if (!App.user) { showAuthModal('login'); return; }
  document.getElementById('bookshelf').classList.add('hidden');
  document.getElementById('bookshelf').classList.remove('hidden'); // keep visible
  // Actually just show bookshelf view
  document.getElementById('category-tabs').style.display = 'none';
  document.getElementById('category-tabs').nextElementSibling.style.display = 'none'; // the bookshelf button
  document.getElementById('recommended-section').style.display = 'none';
  document.getElementById('book-grid').style.display = 'none';
  document.getElementById('no-results').style.display = 'none';
  document.getElementById('bookshelf-view').style.display = '';
  renderBookshelfView();
  document.getElementById('bookshelf').scrollIntoView({behavior:'smooth'});
}
function renderBookshelfView() {
  const shelf = getBookshelfData();
  const allNovels = getAllNovels();
  const books = allNovels.filter(n => shelf.includes(n.id));
  document.getElementById('bookshelf-count').textContent = '共收藏 ' + books.length + ' 本小说';
  const grid = document.getElementById('bookshelf-grid');
  if (books.length === 0) {
    grid.innerHTML = '<p style="text-align:center;color:var(--text2);padding:40px">还没有收藏任何小说<br>点击书籍封面上的 ❤️ 按钮收藏吧</p>';
    return;
  }
  const pos = getLastPosition();
  let html = '';
  books.forEach(book => {
    const progress = (pos && pos.bookId === book.id) ? Math.round((pos.chapterIdx+1)/book.chapters.length*100) : 0;
    const avg = getAvgRating(book.id); const rCount = getRatingCount(book.id);
    const coverGrad = book.cover || COVER_GRADIENTS[book.category] || 'linear-gradient(135deg,#555,#777)';
    const coverEmoji = book.emoji || COVER_EMOJI[book.category] || '📖';
    const catName = Object.entries(CAT_MAP).find(([k,v]) => v === book.category)?.[0] || book.category;
    html += '<div class="book-card" onclick="openReader(\''+book.id+'\','+(progress>0&&pos?.bookId===book.id?pos.chapterIdx:0)+')">'+
      '<div class="book-cover" style="background:'+coverGrad+'"><span class="cover-text">'+coverEmoji+'<br>'+escapeHtml(book.title)+'</span>'+
      '<span class="cat-badge">'+catName+'</span>'+
      (avg>0?'<div class="rating-badge"><span class="rating-num">'+avg.toFixed(1)+'</span> 分 <span class="rating-count">('+rCount+'评)</span></div>':'')+
      '<div class="author-actions" style="top:8px;left:auto;right:8px;bottom:auto"><button class="aa-btn aa-del" style="font-size:14px;padding:4px 8px" onclick="toggleBookshelfItem(\''+book.id+'\',event)">❤️ 取消收藏</button></div>'+
      '</div>'+
      '<div class="book-info"><h3>'+escapeHtml(book.title)+'</h3><div class="author">'+escapeHtml(book.author)+' 著 · '+book.chapters.length+'章</div>'+
      (progress>0?'<div class="progress-bar"><div class="fill" style="width:'+progress+'%"></div></div><div class="progress-label">已读 '+progress+'%</div>':'')+
      '</div></div>';
  });
  grid.innerHTML = html;
}

function onSearch(){App.searchQuery=document.getElementById('search-input').value.trim().toLowerCase();renderBookGrid();}
function filterCategory(cat){App.currentCategory=cat;renderBookshelf();}

function getFilteredBooks(){
  let books=getAllNovels();
  if(App.currentCategory==='推荐'){
    books=books.filter(b=>getAvgRating(b.id)>=7).sort((a,b)=>getAvgRating(b.id)-getAvgRating(a.id));
    if(App.searchQuery){const q=App.searchQuery;books=books.filter(b=>b.title.toLowerCase().includes(q)||b.author.toLowerCase().includes(q)||b.desc.toLowerCase().includes(q));}
    return books;
  }
  if(App.currentCategory!=='全部'){books=books.filter(b=>b.category===CAT_MAP[App.currentCategory]);}
  if(App.searchQuery){const q=App.searchQuery;books=books.filter(b=>b.title.toLowerCase().includes(q)||b.author.toLowerCase().includes(q)||b.desc.toLowerCase().includes(q));}
  return books;
}

function escapeHtml(str){return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function highlightText(text,query){if(!query)return escapeHtml(text);const esc=escapeHtml(text);const re=new RegExp('('+query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');return esc.replace(re,'<mark>$1</mark>');}

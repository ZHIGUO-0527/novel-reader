<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><title>启用 Pages</title>
<style>
  body { font-family: Microsoft YaHei, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; background: #0d1117; color: #c9d1d9; }
  button { padding: 12px 32px; font-size: 18px; background: #238636; color: #fff; border: none; border-radius: 8px; cursor: pointer; margin: 10px; }
  button:hover { background: #2ea043; }
  #status { margin-top: 20px; font-size: 14px; color: #8b949e; }
  #result { margin-top: 10px; font-size: 16px; }
  .success { color: #2ecc71; }
  .error { color: #e74c3c; }
</style></head>
<body>
<h2>一键启用 GitHub Pages</h2>
<p style="color:#8b949e">请确保你已在 GitHub 登录（当前浏览器）</p>
<button onclick="enablePages()">启用 Pages</button>
<div id="status"></div>
<div id="result"></div>
<script>
async function enablePages() {
  const status = document.getElementById('status');
  const result = document.getElementById('result');
  status.textContent = '正在启用...';

  try {
    const res = await fetch('https://api.github.com/repos/ZHIGUO-0527/novel-reader/pages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'application/vnd.github+json',
      },
      body: JSON.stringify({
        source: { branch: 'master', path: '/' },
        build_type: 'legacy'
      })
    });

    const data = await res.json();
    if (res.ok) {
      result.innerHTML = '<span class="success">Pages 已启用！</span><br>访问地址：<a href="https://zhiguo-0527.github.io/novel-reader/" target="_blank" style="color:#58a6ff">https://zhiguo-0527.github.io/novel-reader/</a>';
      status.textContent = '';
    } else if (res.status === 422) {
      // Already enabled, try to update
      result.innerHTML = '<span class="success">Pages 已存在，尝试更新配置...</span>';
      const updateRes = await fetch('https://api.github.com/repos/ZHIGUO-0527/novel-reader/pages', {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/vnd.github+json',
        },
        body: JSON.stringify({
          cname: null,
          source: { branch: 'master', path: '/' },
          build_type: 'legacy'
        })
      });
      if (updateRes.ok) {
        result.innerHTML = '<span class="success">Pages 配置已更新！</span><br>访问地址：<a href="https://zhiguo-0527.github.io/novel-reader/" target="_blank" style="color:#58a6ff">https://zhiguo-0527.github.io/novel-reader/</a>';
      } else {
        result.innerHTML = '<span class="error">更新失败：' + JSON.stringify(await updateRes.json()) + '</span>';
      }
    } else if (res.status === 401) {
      result.innerHTML = '<span class="error">未登录 GitHub，请先在浏览器中登录</span>';
    } else {
      result.innerHTML = '<span class="error">错误：' + JSON.stringify(data) + '</span>';
    }
    status.textContent = '';
  } catch(e) {
    status.textContent = '';
    result.innerHTML = '<span class="error">网络错误：' + e.message + '</span>';
  }
}
</script>
</body></html>
